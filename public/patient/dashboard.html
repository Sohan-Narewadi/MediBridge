<!DOCTYPE html>
<html lang="en" class="mb-auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — MediBridge</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/guard.js" data-role="patient"></script>

<div id="dash-topbar"></div>
<div class="dash-shell">
  <div id="dash-sidebar"></div>
  <main class="dash-main">
    <div id="welcome-block" style="margin-bottom: var(--space-5);">
      <div class="skeleton" style="height:32px; width:280px;"></div>
    </div>

    <div class="grid" style="grid-template-columns: 1.4fr 1fr; align-items:start;" id="dash-top-grid">
      <div class="card skeleton" style="height:160px;"></div>
      <div class="card skeleton" style="height:160px;"></div>
    </div>

    <div class="grid" style="grid-template-columns: repeat(4,1fr); margin-top: var(--space-5);" id="quick-actions"></div>

    <div class="grid" style="grid-template-columns: 1fr 1fr; margin-top: var(--space-5); align-items:start;">
      <div class="card">
        <div class="card-header"><h3>Medications today</h3><a href="/patient/medications.html" class="text-sm">View all</a></div>
        <div id="meds-today"><div class="skeleton" style="height:80px;"></div></div>
      </div>
      <div class="card">
        <div class="card-header"><h3>Recent medical records</h3><a href="/patient/medical-records.html" class="text-sm">View all</a></div>
        <div id="recent-records"><div class="skeleton" style="height:80px;"></div></div>
      </div>
    </div>
  </main>
</div>

<script>
  document.addEventListener('mb:auth-ready', async (e) => {
    const user = e.detail;
    MB_LAYOUT.renderDashboardShell('patient', 'Patient Dashboard');
    MB_LAYOUT.renderUserMenu(user, { showDashboardLink: false });
    document.getElementById('welcome-block').innerHTML = `<h2 style="margin-bottom:2px;">Welcome back, ${user.fullName.split(' ')[0]}</h2><p class="text-muted">Here's what's happening with your health today.</p>`;

    try {
      const data = await api.get('/dashboard/patient');
      renderTopGrid(data);
      renderQuickActions();
      renderMedsToday(data.medicationsToday);
      renderRecentRecords(data.recentRecords);
    } catch (err) {
      toast.error('Could not load dashboard data.');
    }
  });

  function statusBadge(status) {
    return `<span class="badge status-${status}">${status}</span>`;
  }

  function careScoreRing(score) {
    const radius = 46, stroke = 10;
    const circumference = 2 * Math.PI * radius;
    const offset = circumference - (score / 100) * circumference;
    const color = score >= 75 ? 'var(--color-success-500)' : score >= 50 ? 'var(--color-warning-500)' : 'var(--color-danger-500)';
    return `
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="${radius}" fill="none" stroke="var(--color-ink-100)" stroke-width="${stroke}"></circle>
        <circle cx="60" cy="60" r="${radius}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round" transform="rotate(-90 60 60)"></circle>
        <text x="60" y="66" text-anchor="middle" font-size="26" font-weight="800" fill="var(--color-ink-900)">${score}</text>
      </svg>`;
  }

  function renderTopGrid(data) {
    const grid = document.getElementById('dash-top-grid');
    const appt = data.nextAppointment;
    const cs = data.careScore;

    grid.innerHTML = `
      <div class="card">
        <div class="card-header"><h3>Upcoming appointment</h3><a href="/patient/appointments.html" class="text-sm">See all</a></div>
        ${appt ? `
          <div class="flex justify-between items-start">
            <div>
              <h4 style="margin-bottom:2px;">${appt.doctor_name}</h4>
              <p class="text-sm text-muted mb-0">${appt.specialization}</p>
              <p class="text-sm" style="margin-top:6px;">&#128197; ${appt.appointment_date} at ${appt.start_time.slice(0,5)} &#8226; ${appt.consultation_mode.replace('_',' ')}</p>
            </div>
            ${statusBadge(appt.status)}
          </div>
          <a href="/patient/appointments.html" class="btn btn-outline btn-sm" style="margin-top:var(--space-3);">Manage appointment</a>
        ` : `<div class="empty-state"><div class="icon">&#128197;</div><p>No upcoming appointments.</p><a href="/patient/doctors.html" class="btn btn-primary btn-sm">Book one now</a></div>`}
        <hr class="divider">
        <div class="flex gap-5 text-sm text-muted">
          <span><strong style="color:var(--color-ink-900);">${data.counts.upcoming || 0}</strong> upcoming</span>
          <span><strong style="color:var(--color-ink-900);">${data.counts.completed || 0}</strong> completed</span>
          <span><strong style="color:var(--color-ink-900);">${data.counts.cancelled || 0}</strong> cancelled</span>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h3>Your Care Score</h3></div>
        <div class="care-score-gauge">
          ${careScoreRing(cs.score)}
          <div style="font-size:0.8rem;">
            <p class="mb-0"><strong>Adherence:</strong> ${cs.breakdown.adherence.label}</p>
            <p class="mb-0" style="margin-top:4px;"><strong>Checkups:</strong> ${cs.breakdown.recency.label}</p>
            <p class="mb-0" style="margin-top:4px;"><strong>Follow-ups:</strong> ${cs.breakdown.followUp.label}</p>
          </div>
        </div>
      </div>
    `;
  }

  function renderQuickActions() {
    const actions = [
      ['/patient/doctors.html', '&#128269;', 'Find a doctor'],
      ['/patient/appointments.html', '&#128197;', 'Book appointment'],
      ['/patient/medications.html', '&#9201;', 'Log medication'],
      ['/patient/medical-records.html', '&#128203;', 'View records'],
    ];
    document.getElementById('quick-actions').innerHTML = actions.map(([href, icon, label]) => `
      <a href="${href}" class="card card-interactive text-center" style="text-decoration:none; color:inherit; padding: var(--space-4);">
        <div style="font-size:1.6rem;">${icon}</div>
        <div class="text-sm" style="font-weight:700; margin-top:4px;">${label}</div>
      </a>
    `).join('');
  }

  function renderMedsToday(meds) {
    const el = document.getElementById('meds-today');
    if (!meds.length) { el.innerHTML = '<p class="text-muted text-sm">No medications scheduled for today.</p>'; return; }
    el.innerHTML = meds.map((m) => `
      <div class="flex justify-between items-center" style="padding: var(--space-2) 0; border-bottom:1px solid var(--color-ink-100);">
        <div><strong class="text-sm">${m.medicine_name}</strong><div class="text-sm text-muted">${m.dosage} &#8226; ${m.frequency}</div></div>
        <span class="badge ${m.today_status === 'taken' ? 'badge-success' : m.today_status ? 'badge-warning' : 'badge-neutral'}">${m.today_status || 'pending'}</span>
      </div>
    `).join('');
  }

  function renderRecentRecords(records) {
    const el = document.getElementById('recent-records');
    if (!records.length) { el.innerHTML = '<p class="text-muted text-sm">No medical records yet.</p>'; return; }
    el.innerHTML = records.map((r) => `
      <div style="padding: var(--space-2) 0; border-bottom:1px solid var(--color-ink-100);">
        <strong class="text-sm">${r.diagnosis}</strong>
        <div class="text-sm text-muted">${r.doctor_name} &#8226; ${r.record_date}</div>
      </div>
    `).join('');
  }
</script>
</body>
</html>
