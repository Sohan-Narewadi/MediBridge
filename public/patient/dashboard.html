<!DOCTYPE html>
<html lang="en" class="mb-auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — MediBridge</title>
<link rel="stylesheet" href="/css/main.css">
<style>
  /* One hero card: the single thing that needs the patient right now */
  .focus { display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); flex-wrap: wrap; padding: var(--space-6); border-left: 3px solid var(--color-primary-600); }
  .focus.is-danger { border-left-color: var(--color-danger-500); }
  .focus.is-warning { border-left-color: var(--color-warning-500); }
  .focus.is-calm { border-left-color: var(--color-success-500); }
  .focus .label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-ink-500); display: flex; align-items: center; gap: 0.4rem; }
  .focus .big { font-family: var(--font-display); font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; letter-spacing: -0.03em; margin: 0.3rem 0 0.25rem; }
  .focus .line { color: var(--color-ink-700); font-size: 0.95rem; }
  .focus .steps { display: flex; gap: 4px; margin-top: var(--space-4); max-width: 360px; }
  .focus .steps span { flex: 1; height: 5px; border-radius: 3px; background: var(--color-ink-150); }
  .focus .steps .s-done { background: var(--color-success-500); }
  .focus .steps .s-in_progress { background: var(--color-warning-500); }
  .focus .steps .s-blocked { background: var(--color-danger-500); }

  /* Four quiet tiles */
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); margin-top: var(--space-4); }
  .tile { display: flex; flex-direction: column; gap: 0.15rem; padding: var(--space-4) var(--space-5); color: inherit; text-decoration: none; }
  .tile:hover { text-decoration: none; }
  .tile .ic { color: var(--color-primary-600); margin-bottom: var(--space-2); }
  .tile .num { font-family: var(--font-display); font-size: 2rem; line-height: 1.05; letter-spacing: -0.03em; }
  .tile .num small { font-family: var(--font-body); font-size: 0.8rem; color: var(--color-ink-500); letter-spacing: 0; margin-left: 2px; }
  .tile .cap { font-size: 0.78rem; color: var(--color-ink-500); }
  @media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .today-row { display: flex; align-items: center; gap: var(--space-3); padding: 0.6rem 0; border-top: 1px solid var(--color-ink-150); min-width: 0; }
  .today-row:first-child { border-top: 0; }
  .today-row .when { font-family: var(--font-mono); font-size: 0.78rem; color: var(--color-ink-500); width: 44px; flex-shrink: 0; }
  .today-row .what { flex: 1; min-width: 0; font-size: 0.9rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .today-row .what small { color: var(--color-ink-500); font-weight: 400; margin-left: 0.4rem; }
  details.how { margin-top: var(--space-4); font-size: 0.84rem; color: var(--color-ink-700); }
  details.how summary { cursor: pointer; color: var(--color-ink-500); font-size: 0.8rem; }
  details.how .rows { margin-top: var(--space-3); display: grid; gap: 0.45rem; }
  details.how .rows div { display: flex; justify-content: space-between; gap: var(--space-3); }
  details.how .rows span:last-child { color: var(--color-ink-500); text-align: right; }
</style>
</head>
<body>
<script src="/js/icons.js"></script>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/guard.js" data-role="patient"></script>

<div id="dash-topbar"></div>
<div class="dash-shell">
  <div id="dash-sidebar"></div>
  <main class="dash-main">
    <div class="page-head" id="welcome-block">
      <div><div class="skeleton" style="height:28px; width:220px;"></div></div>
    </div>

    <div id="focus"><div class="skeleton" style="height:150px;"></div></div>
    <div class="tiles" id="tiles"></div>

    <div class="card" style="margin-top: var(--space-4);">
      <div class="card-header"><h3>Today</h3><a href="/patient/care-plan.html">All to-dos</a></div>
      <div id="today"><div class="skeleton" style="height:96px;"></div></div>
    </div>
    <div id="how"></div>
  </main>
</div>

<script>
  const { esc, fmtMinutes, icon } = MB_LAYOUT;
  const DEPT = { billing: 'Billing', insurance: 'Insurance', pharmacy: 'Pharmacy', nursing: 'Nursing', documentation: 'Records' };
  const S = { stay: null, intakes: [], core: null, commits: null };

  function parseDate(iso) { const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
  function daysFromToday(iso) { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((parseDate(iso) - t) / 86400000); }
  function relDay(iso) {
    const n = daysFromToday(iso);
    if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow';
    return n > 0 ? `In ${n} days` : `${-n}d ago`;
  }

  MB_LAYOUT.onAuthReady(async (e) => {
    const user = e.detail;
    MB_LAYOUT.renderDashboardShell('patient', 'Dashboard');
    MB_LAYOUT.renderUserMenu(user, { showDashboardLink: false });
    const hour = new Date().getHours();
    const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    document.getElementById('welcome-block').innerHTML = `
      <div><h2 class="mb-0">${greet}, ${esc((user.fullName || '').split(' ')[0])}</h2></div>
      <div class="actions"><a href="/patient/doctors.html" class="btn btn-primary">${icon('plus')}Book</a></div>`;
    await Promise.all([loadStay(), loadIntakes(), loadCore(), loadCommitments()]);
    render();
    MB_LAYOUT.hydrate();
  });

  async function loadStay() { try { S.stay = await api.get('/discharge/my-stay'); } catch (e) { S.stay = null; } }
  async function loadIntakes() { try { S.intakes = (await api.get('/visit-loop/pending-intakes')).appointments || []; } catch (e) { S.intakes = []; } }
  async function loadCore() { try { S.core = await api.get('/dashboard/patient'); } catch (e) { S.core = null; toast.error('Could not load dashboard data.'); } }
  async function loadCommitments() { try { S.commits = await api.get('/visit-loop/commitments'); } catch (e) { S.commits = null; } }

  function render() { renderFocus(); renderTiles(); renderToday(); renderHow(); }

  // ------------------------------------------------------------ focus card
  function renderFocus() {
    const el = document.getElementById('focus');
    const adm = S.stay && S.stay.admission;
    const overdue = (S.commits && S.commits.overdue) || [];
    const appt = S.core && S.core.nextAppointment;
    let tone = '', label = '', big = '', line = '', btn = '', extra = '';

    if (adm && (adm.status === 'cleared' || adm.cleared_at)) {
      const b = S.stay.bottleneck;
      const tasks = S.stay.tasks || [];
      tone = b && b.status === 'blocked' ? 'is-danger' : 'is-warning';
      label = `${icon('hospital', 14)}Hospital stay`;
      big = fmtMinutes(S.stay.waiting_minutes);
      line = b ? `Waiting on <strong>${esc(DEPT[b.department] || b.department)}</strong>` : 'All steps done. Waiting for discharge sign-off.';
      btn = `<a href="/patient/hospital-stay.html" class="btn btn-primary">Track discharge</a>`;
      extra = `<div class="steps" aria-label="Discharge steps">${tasks.map((t) => `<span class="s-${esc(t.status)}" title="${esc(DEPT[t.department] || t.department)}"></span>`).join('')}</div>`;
    } else if (adm) {
      label = `${icon('hospital', 14)}Hospital stay`;
      big = esc(adm.ward || 'Admitted');
      line = adm.bed ? `Bed ${esc(adm.bed)}` : 'Admitted';
      btn = `<a href="/patient/hospital-stay.html" class="btn btn-primary">View stay</a>`;
    } else if (overdue.length) {
      const c = overdue[0];
      tone = 'is-danger';
      label = `${icon('alert', 14)}Overdue`;
      big = `${overdue.length} to-do${overdue.length === 1 ? '' : 's'}`;
      line = esc(c.title);
      btn = `<a href="/patient/care-plan.html" class="btn btn-primary">Open plan</a>`;
    } else if (S.intakes.length) {
      const a = S.intakes[0];
      tone = 'is-warning';
      label = `${icon('fileText', 14)}Before your visit`;
      big = relDay(a.appointment_date);
      line = `Tell ${esc(a.doctor_name)} why you're coming. 2 minutes.`;
      btn = `<a href="/patient/intake.html?appointment=${a.id}" class="btn btn-primary">Fill form</a>`;
    } else if (appt) {
      label = `${icon('calendar', 14)}Next visit`;
      big = relDay(appt.appointment_date);
      line = `${esc(appt.doctor_name)} · ${esc(appt.start_time.slice(0, 5))}`;
      btn = `<a href="/patient/appointments.html" class="btn btn-outline">Manage</a>`;
    } else {
      tone = 'is-calm';
      label = `${icon('check', 14)}All clear`;
      big = 'Nothing due';
      line = 'No visits or to-dos waiting.';
      btn = `<a href="/patient/doctors.html" class="btn btn-outline">Find a doctor</a>`;
    }
    el.innerHTML = `
      <div class="card focus ${tone}">
        <div class="min-w-0">
          <div class="label">${label}</div>
          <div class="big">${big}</div>
          <div class="line">${line}</div>
          ${extra}
        </div>
        <div>${btn}</div>
      </div>`;
  }

  // ----------------------------------------------------------------- tiles
  function scoreColor(n) { return n >= 75 ? 'var(--color-success-700)' : n >= 50 ? 'var(--color-warning-700)' : 'var(--color-danger-700)'; }
  function renderTiles() {
    const core = S.core || {};
    const cs = core.careScore;
    const appt = core.nextAppointment;
    const meds = core.medicationsToday || [];
    const due = meds.filter((m) => !m.today_status).length;
    const c = S.commits || {};
    const todos = (c.overdue || []).length + (c.open || []).length;
    document.getElementById('tiles').innerHTML = `
      <a class="card card-interactive tile" href="#how-details" onclick="document.getElementById('how-details') && (document.getElementById('how-details').open = true)">
        <span class="ic">${icon('heartPulse', 20)}</span>
        <span class="num" style="${cs ? `color:${scoreColor(cs.score)}` : ''}">${cs ? cs.score : '—'}<small>/100</small></span>
        <span class="cap">Care score</span>
      </a>
      <a class="card card-interactive tile" href="/patient/appointments.html">
        <span class="ic">${icon('calendar', 20)}</span>
        <span class="num">${appt ? parseDate(appt.appointment_date).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '—'}</span>
        <span class="cap">Next visit</span>
      </a>
      <a class="card card-interactive tile" href="/patient/medications.html">
        <span class="ic">${icon('pill', 20)}</span>
        <span class="num">${due}<small>left</small></span>
        <span class="cap">Medicines today</span>
      </a>
      <a class="card card-interactive tile" href="/patient/care-plan.html">
        <span class="ic">${icon('listChecks', 20)}</span>
        <span class="num">${todos}</span>
        <span class="cap">${(c.overdue || []).length ? `${c.overdue.length} overdue` : 'Open to-dos'}</span>
      </a>`;
  }

  // ----------------------------------------------------------------- today
  function renderToday() {
    const el = document.getElementById('today');
    const meds = ((S.core && S.core.medicationsToday) || []);
    const c = S.commits || {};
    const todos = [...(c.overdue || []).map((x) => [x, true]), ...(c.open || []).filter((x) => x.due_date && daysFromToday(x.due_date) <= 3).map((x) => [x, false])].filter(([x]) => !x.owner_role || x.owner_role === 'patient').slice(0, 4);
    if (!meds.length && !todos.length) { el.innerHTML = '<p class="text-muted text-sm mb-0">Nothing for today.</p>'; return; }
    el.innerHTML = meds.map((m) => `
      <div class="today-row">
        <span class="when">${esc(String(m.reminder_times || '').split(',')[0].slice(0, 5))}</span>
        <span class="what">${esc(m.medicine_name)}<small>${esc(m.dosage || '')}</small></span>
        ${m.today_status
          ? `<span class="badge status-${esc(m.today_status)}">${esc(m.today_status)}</span>`
          : `<button class="btn btn-outline btn-sm" data-take="${m.id}">${icon('check', 14)}Taken</button>`}
      </div>`).join('') + todos.map(([x, late]) => `
      <div class="today-row">
        <span class="when">${icon('listChecks', 16)}</span>
        <span class="what">${esc(x.title)}${late ? '<small style="color:var(--color-danger-700);">overdue</small>' : ''}</span>
        <button class="btn btn-outline btn-sm" data-commit="${x.id}">${icon('check', 14)}Done</button>
      </div>`).join('');
    MB_LAYOUT.hydrate();
    el.querySelectorAll('[data-take]').forEach((btn) => btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        await api.post(`/medications/${btn.dataset.take}/log`, { status: 'taken' });
        btn.outerHTML = '<span class="badge status-taken">taken</span>';
        toast.success('Logged.');
        loadCore().then(renderTiles);
      } catch (err) { btn.disabled = false; toast.error(err.message); }
    }));
    el.querySelectorAll('[data-commit]').forEach((btn) => btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        await api.patch(`/visit-loop/commitments/${btn.dataset.commit}`, { status: 'done' });
        toast.success('Done.');
        await loadCommitments(); render(); MB_LAYOUT.hydrate();
      } catch (err) { btn.disabled = false; toast.error(err.message); }
    }));
  }

  // ----------------------------------------------------- score explanation
  function renderHow() {
    const cs = S.core && S.core.careScore;
    const el = document.getElementById('how');
    if (!cs || !cs.breakdown) { el.innerHTML = ''; return; }
    const parts = [['Medicines taken', '40%', cs.breakdown.adherence], ['Recent check-up', '35%', cs.breakdown.recency], ['Follow-ups kept', '25%', cs.breakdown.followUp]];
    el.innerHTML = `
      <details class="how" id="how-details">
        <summary>How is this calculated?</summary>
        <div class="rows">
          ${parts.map(([n, w, p]) => `<div><span>${n} <span class="text-xs text-muted mono">${w}</span></span><span>${esc(p ? p.label : '')}</span></div>`).join('')}
          <div class="text-xs text-muted">Engagement with your care plan, not a diagnosis.</div>
        </div>
      </details>`;
  }

  // Keep the live discharge card fresh while the page is open.
  setInterval(async () => { if (document.visibilityState === 'visible' && window.MB_USER) { await loadStay(); renderFocus(); MB_LAYOUT.hydrate(); } }, 60000);
</script>
</body>
</html>
