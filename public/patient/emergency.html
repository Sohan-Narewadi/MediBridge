<!DOCTYPE html>
<html lang="en" class="mb-auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency Connect — MediBridge</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/emergency.css">
</head>
<body>
<script src="/js/icons.js"></script>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/emergency.js"></script>
<script src="/js/guard.js" data-role="patient"></script>

<div id="dash-topbar"></div>
<div class="dash-shell">
  <div id="dash-sidebar"></div>
  <main class="dash-main" id="em-root"></main>
</div>

<script>
  MB_LAYOUT.onAuthReady((e) => {
    MB_LAYOUT.renderDashboardShell('patient', 'Emergency Connect');
    MB_LAYOUT.renderUserMenu(e.detail, { showDashboardLink: false });
    MB_EMERGENCY.mount(document.getElementById('em-root'));
    MB_LAYOUT.hydrate();
  });
</script>
</body>
</html>
