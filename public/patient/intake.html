<!DOCTYPE html>
<html lang="en" class="mb-auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before Your Visit — MediBridge</title>
<link rel="stylesheet" href="/css/main.css">
<style>
  .in-intake-layout { max-width: 640px; display: flex; flex-direction: column; gap: var(--space-4); }
  details.in-more { margin-bottom: var(--space-4); }
  details.in-more summary { cursor: pointer; font-size: 0.86rem; color: var(--color-ink-500); margin-bottom: var(--space-3); }
  details.in-file { font-size: 0.86rem; }
  details.in-file summary { cursor: pointer; display: flex; align-items: center; gap: var(--space-2); color: var(--color-ink-700); }
  .in-eyebrow { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-primary-700); margin-bottom: var(--space-1); }
  .in-on-file { background: var(--color-primary-50); border-color: var(--color-primary-100); }
  .in-on-file dl { display: grid; grid-template-columns: 120px 1fr; gap: var(--space-2) var(--space-3); font-size: 0.88rem; margin: 0; }
  .in-on-file dt { color: var(--color-ink-500); font-weight: 600; }
  .in-on-file dd { margin: 0; color: var(--color-ink-900); }
  .in-chip-picker { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .in-chip-picker button { border: 1.5px solid var(--color-ink-200); background: var(--color-surface); color: var(--color-ink-700); padding: 0.4rem 0.85rem; border-radius: var(--radius-full); font-size: 0.84rem; font-weight: 600; cursor: pointer; }
  .in-chip-picker button[aria-pressed="true"] { background: var(--color-primary-600); border-color: var(--color-primary-600); color: var(--color-surface); }
  .in-chip-add { display: flex; gap: var(--space-2); margin-top: var(--space-2); max-width: 360px; }
  .in-sev-picker { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-2); }
  .in-sev-picker button { border: 1.5px solid var(--color-ink-200); background: var(--color-surface); border-radius: var(--radius-sm); padding: 0.55rem 0.25rem; cursor: pointer; text-align: center; color: var(--color-ink-700); }
  .in-sev-picker button .in-n { display: block; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
  .in-sev-picker button .in-t { display: block; font-size: 0.7rem; font-weight: 600; }
  .in-sev-picker button[aria-pressed="true"] { border-color: var(--color-primary-600); background: var(--color-primary-50); color: var(--color-primary-800); box-shadow: inset 0 0 0 1px var(--color-primary-600); }
  .in-step-label { display: flex; align-items: baseline; gap: var(--space-2); }
  .in-step-label .in-num { font-family: var(--font-display); font-weight: 800; color: var(--color-primary-700); }
  .in-opt { font-weight: 500; color: var(--color-ink-500); font-size: 0.78rem; }
</style>
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/guard.js" data-role="patient"></script>

<div id="dash-topbar"></div>
<div class="dash-shell">
  <div id="dash-sidebar"></div>
  <main class="dash-main">
    <div id="intake-head" style="margin-bottom: var(--space-4);"><div class="skeleton" style="height:36px; width:340px;"></div></div>

    <div class="in-intake-layout">
      <div class="card card-compact in-on-file" id="on-file"><div class="skeleton" style="height:24px;"></div></div>
      <form class="card" id="intake-form" novalidate>
        <div class="field">
          <label for="complaint">Why are you coming?</label>
          <input id="complaint" maxlength="255" placeholder="e.g. Breathless on stairs" required>
        </div>

        <div class="field">
          <label>Symptoms</label>
          <div class="in-chip-picker" id="symptom-chips"></div>
          <div class="in-chip-add">
            <input id="symptom-custom" placeholder="Other" maxlength="40">
            <button type="button" class="btn btn-outline btn-sm" id="symptom-add">Add</button>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="duration">For how long?</label>
            <select id="duration">
              <option value="">Select…</option>
              <option>Since today</option>
              <option>1-3 days</option>
              <option>About a week</option>
              <option>2 weeks</option>
              <option>About a month</option>
              <option>More than a month</option>
            </select>
          </div>
          <div class="field">
            <label>How bad?</label>
            <div class="in-sev-picker" id="sev-picker"></div>
          </div>
        </div>

        <details class="in-more">
          <summary>Add more (optional)</summary>
          <div class="field"><label for="med-changes">Medicine changes</label><input id="med-changes" maxlength="255"></div>
          <div class="field"><label for="new-allergies">New allergies</label><input id="new-allergies" maxlength="255"></div>
          <div class="field mb-0"><label for="questions">Question for the doctor</label><textarea id="questions" rows="2" maxlength="500"></textarea></div>
        </details>

        <div id="form-alert"></div>
        <div class="flex gap-3" style="flex-wrap:wrap;">
          <button type="submit" class="btn btn-primary" id="submit-btn">Send</button>
          <a href="/patient/appointments.html" class="btn btn-ghost">Skip</a>
        </div>
      </form>
    </div>
  </main>
</div>

<script>
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const appointmentId = Number(new URLSearchParams(window.location.search).get('appointment'));
  const COMMON_SYMPTOMS = ['Fever', 'Cough', 'Headache', 'Fatigue', 'Breathlessness', 'Chest pain', 'Dizziness', 'Nausea', 'Body ache', 'Back pain', 'Joint pain', 'Sore throat', 'Rash', 'Palpitations', 'Poor sleep', 'Anxiety'];
  const SEVERITY = [[1, 'Mild'], [2, 'Noticeable'], [3, 'Moderate'], [4, 'Severe'], [5, 'Very severe']];
  const selectedSymptoms = new Set();
  let severity = null;

  document.addEventListener('mb:auth-ready', async (e) => {
    MB_LAYOUT.renderDashboardShell('patient', 'Before your visit');
    MB_LAYOUT.renderUserMenu(e.detail, { showDashboardLink: false });
    if (!appointmentId) {
      document.getElementById('intake-head').innerHTML = '<div class="alert alert-warning">No appointment selected. Open this form from <a href="/patient/appointments.html">My Appointments</a>.</div>';
      document.getElementById('intake-form').hidden = true;
      return;
    }
    renderSeverity();
    renderChips();
    try {
      const [{ appointment }, { profile }, meds, { intake }] = await Promise.all([
        api.get(`/appointments/${appointmentId}`),
        api.get('/users/me/profile'),
        api.get('/medications?bucket=today').catch(() => ({ medications: [] })),
        api.get(`/visit-loop/intake/${appointmentId}`),
      ]);
      renderHead(appointment, intake);
      renderOnFile(profile, meds.medications || []);
      if (intake) prefill(intake);
      if (!['pending', 'confirmed'].includes(appointment.status)) {
        document.getElementById('form-alert').innerHTML = '<div class="alert alert-info">This appointment is no longer upcoming, so pre-visit information can\'t be changed.</div>';
        document.getElementById('submit-btn').disabled = true;
      }
    } catch (err) {
      document.getElementById('intake-head').innerHTML = `<div class="alert alert-danger">${esc(err.message || 'Could not load this appointment.')}</div>`;
      document.getElementById('intake-form').hidden = true;
    }
  });

  function fmtDate(d) {
    return new Date(`${d.slice(0, 10)}T00:00:00`).toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function renderHead(a, intake) {
    document.getElementById('intake-head').innerHTML = `
      <h2 class="mb-0">${esc(a.doctor_name)}</h2>
      <p class="text-muted mb-0 text-sm">${esc(fmtDate(a.appointment_date))} · ${esc(a.start_time.slice(0, 5))}</p>`;
  }

  function renderOnFile(p, meds) {
    const age = p.date_of_birth ? Math.floor((Date.now() - new Date(`${p.date_of_birth}T00:00:00`)) / (365.25 * 86400000)) : null;
    document.getElementById('on-file').innerHTML = `
      <details class="in-file">
        <summary><span class="badge badge-success">On file</span> Allergies, conditions, medicines</summary>
        <dl style="margin-top: var(--space-3);">
          <dt>Age / sex</dt><dd>${age != null ? age + ' y' : '—'} · ${esc((p.gender || '—').replace(/_/g, ' '))} · ${esc(p.blood_group || '—')}</dd>
          <dt>Allergies</dt><dd>${esc(p.allergies || 'None')}</dd>
          <dt>Conditions</dt><dd>${esc(p.chronic_conditions || 'None')}</dd>
          <dt>Medicines</dt><dd>${meds.length ? meds.map((m) => esc(m.medicine_name)).join(', ') : 'None active'}</dd>
        </dl>
        <a href="/patient/profile.html" class="text-sm">Edit profile</a>
      </details>`;
  }

  function renderChips() {
    const wrap = document.getElementById('symptom-chips');
    const all = [...new Set([...COMMON_SYMPTOMS, ...selectedSymptoms])];
    wrap.innerHTML = all.map((s) => `<button type="button" data-s="${esc(s)}" aria-pressed="${selectedSymptoms.has(s)}">${esc(s)}</button>`).join('');
    wrap.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      const s = b.dataset.s;
      if (selectedSymptoms.has(s)) selectedSymptoms.delete(s); else selectedSymptoms.add(s);
      b.setAttribute('aria-pressed', selectedSymptoms.has(s));
    }));
  }

  function renderSeverity() {
    const wrap = document.getElementById('sev-picker');
    wrap.innerHTML = SEVERITY.map(([n, t]) => `<button type="button" data-n="${n}" aria-pressed="${severity === n}"><span class="in-n">${n}</span><span class="in-t">${t}</span></button>`).join('');
    wrap.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { severity = Number(b.dataset.n); renderSeverity(); }));
  }

  function addCustomSymptom() {
    const input = document.getElementById('symptom-custom');
    const v = input.value.trim();
    if (!v) return;
    selectedSymptoms.add(v.charAt(0).toUpperCase() + v.slice(1));
    input.value = '';
    renderChips();
  }
  document.getElementById('symptom-add').addEventListener('click', addCustomSymptom);
  document.getElementById('symptom-custom').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addCustomSymptom(); } });

  function prefill(i) {
    document.getElementById('complaint').value = i.chief_complaint || '';
    (i.symptoms || '').split(',').map((s) => s.trim()).filter(Boolean).forEach((s) => selectedSymptoms.add(s));
    renderChips();
    const dur = document.getElementById('duration');
    if (i.symptom_duration && ![...dur.options].some((o) => o.value === i.symptom_duration)) dur.add(new Option(i.symptom_duration, i.symptom_duration));
    dur.value = i.symptom_duration || '';
    severity = i.severity || null;
    renderSeverity();
    document.getElementById('med-changes').value = i.medication_changes || '';
    document.getElementById('new-allergies').value = i.new_allergies || '';
    document.getElementById('questions').value = i.questions_for_doctor || '';
    document.getElementById('submit-btn').textContent = 'Update';
  }

  document.getElementById('intake-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('form-alert');
    alertBox.innerHTML = '';
    const complaint = document.getElementById('complaint').value.trim();
    if (complaint.length < 3) {
      document.getElementById('complaint').classList.add('invalid');
      alertBox.innerHTML = '<div class="alert alert-danger">Add a short reason.</div>';
      return;
    }
    document.getElementById('complaint').classList.remove('invalid');
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Sending…';
    try {
      await api.post('/visit-loop/intake', {
        appointmentId,
        chiefComplaint: complaint,
        symptoms: [...selectedSymptoms],
        symptomDuration: document.getElementById('duration').value || null,
        severity,
        medicationChanges: document.getElementById('med-changes').value.trim() || null,
        newAllergies: document.getElementById('new-allergies').value.trim() || null,
        questionsForDoctor: document.getElementById('questions').value.trim() || null,
      });
      toast.success('Sent.');
      setTimeout(() => { window.location.href = '/patient/appointments.html'; }, 900);
    } catch (err) {
      const details = err.details ? err.details.map((d) => esc(d.message)).join('<br>') : esc(err.message);
      alertBox.innerHTML = `<div class="alert alert-danger">${details}</div>`;
      btn.disabled = false;
      btn.textContent = 'Send';
    }
  });
</script>
</body>
</html>
