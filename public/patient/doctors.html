<!DOCTYPE html>
<html lang="en" class="mb-auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Doctors — MediBridge</title>
<link rel="stylesheet" href="/css/main.css">
<style>
  .filter-bar { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: var(--space-3); margin-top: var(--space-4); }
  @media (max-width: 760px) { .filter-bar { grid-template-columns: 1fr 1fr; } .filter-bar input { grid-column: 1 / -1; } }
  .doctor-card .meta-row { margin-bottom: var(--space-2); }
</style>
</head>
<body>
<script src="/js/icons.js"></script>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/guard.js" data-role="patient"></script>

<div id="dash-topbar"></div>
<div class="dash-shell">
  <div id="dash-sidebar"></div>
  <main class="dash-main">
    <h2>Find a doctor</h2>

    <div class="filter-bar">
      <input type="text" id="f-q" placeholder="Search name or specialty" aria-label="Search">
      <select id="f-spec" aria-label="Specialization"><option value="">All specialties</option></select>
      <select id="f-mode" aria-label="Consultation"><option value="">Any mode</option><option value="in_person">In person</option><option value="video">Video</option></select>
      <select id="sort-select" aria-label="Sort"><option value="rating">Top rated</option><option value="experience">Most experienced</option><option value="fee_low">Lowest fee</option></select>
    </div>
    <div id="result-count" class="text-muted text-xs" style="margin: var(--space-3) 0;">&nbsp;</div>
    <div class="doctor-grid" id="doctor-results"><div class="card skeleton" style="height:160px;"></div><div class="card skeleton" style="height:160px;"></div></div>
  </main>
</div>

<script>
  document.addEventListener('mb:auth-ready', (e) => {
    MB_LAYOUT.renderDashboardShell('patient', 'Find Doctors');
    MB_LAYOUT.renderUserMenu(e.detail, { showDashboardLink: false });
    init();
  });

  function initials(name) { return name.split(' ').map((p) => p[0]).slice(0, 2).join('').toUpperCase(); }

  async function init() {
    const { specializations } = await api.get('/specializations');
    const sel = document.getElementById('f-spec');
    specializations.forEach((s) => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.name; sel.appendChild(o); });
    ['f-q'].forEach((id) => document.getElementById(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); }));
    ['f-spec', 'f-mode', 'sort-select'].forEach((id) => document.getElementById(id).addEventListener('change', load));
    load();
  }

  async function load() {
    const grid = document.getElementById('doctor-results');
    grid.innerHTML = '<div class="card skeleton" style="height:260px;"></div><div class="card skeleton" style="height:260px;"></div>';
    const params = new URLSearchParams();
    const q = document.getElementById('f-q').value.trim();
    if (q) params.set('q', q);
    if (document.getElementById('f-spec').value) params.set('specialization', document.getElementById('f-spec').value);
    if (document.getElementById('f-mode').value) params.set('mode', document.getElementById('f-mode').value);
    params.set('sort', document.getElementById('sort-select').value);
    params.set('pageSize', 12);

    const { doctors, total } = await api.get(`/doctors?${params.toString()}`);
    document.getElementById('result-count').textContent = `${total} doctor${total === 1 ? '' : 's'}`;
    if (!doctors.length) { grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="icon" data-icon="search"></div><p>No matches.</p></div>'; return; }
    grid.innerHTML = doctors.map((d) => `
      <a href="/doctor.html?id=${d.id}" class="card doctor-card card-interactive" style="text-decoration:none; color:inherit;">
        <div class="photo">${initials(d.full_name)}</div>
        <h4>${d.full_name}</h4>
        <div class="spec">${d.specialization}</div>
        <div class="meta-row"><span>${d.experience_years} yrs</span><span>&#8377;${d.consultation_fee}</span><span class="rating">&#9733; ${Number(d.rating_avg).toFixed(1)}</span></div>
      </a>
    `).join('');
    MB_LAYOUT.hydrate();
  }
</script>
</body>
</html>
