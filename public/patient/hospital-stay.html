<!DOCTYPE html>
<html lang="en" class="mb-auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Stay — MediBridge</title>
<link rel="stylesheet" href="/css/main.css">
<style>
  .stay-hero { margin-bottom: var(--space-5); }
  .stay-hero .eyebrow { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-primary-700); margin-bottom: var(--space-2); }
  .waiting-callout { display: flex; justify-content: space-between; gap: var(--space-5); flex-wrap: wrap; align-items: center;
    padding: var(--space-5); border-radius: var(--radius-lg); background: var(--color-warning-100); border: 1px solid var(--color-warning-500); margin-bottom: var(--space-5); }
  .waiting-callout.ready { background: var(--color-success-100); border-color: var(--color-success-500); }
  .waiting-callout .label { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-ink-700); }
  .waiting-callout .what { font-family: var(--font-display); font-size: 1.45rem; font-weight: 800; color: var(--color-ink-900); margin: var(--space-1) 0; }
  .waiting-callout .clock { font-family: var(--font-display); font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--color-ink-900); text-align: right; }
  .progress-line { height: 8px; border-radius: var(--radius-full); background: var(--color-ink-100); overflow: hidden; margin: var(--space-3) 0 var(--space-5); }
  .progress-line > span { display: block; height: 100%; background: var(--color-primary-600); transition: width 0.5s ease; }
  .stepper { list-style: none; padding: 0; margin: 0; }
  .step { display: grid; grid-template-columns: 34px 1fr auto; gap: var(--space-3); position: relative; padding-bottom: var(--space-5); }
  .step:last-child { padding-bottom: 0; }
  .step::before { content: ''; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--color-ink-200); }
  .step:last-child::before { display: none; }
  .step .node { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--color-ink-300); background: var(--color-surface);
    display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
  .step.done .node { background: var(--color-success-500); border-color: var(--color-success-500); color: var(--color-surface); }
  .step.in_progress .node { border-color: var(--color-info-500); }
  .step.in_progress .node::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--color-info-500); }
  .step.blocked .node { border-color: var(--color-warning-500); background: var(--color-warning-100); }
  .step.blocked .node::after { content: '!'; font-weight: 800; color: var(--color-warning-500); }
  .step h4 { margin: 4px 0 2px; }
  .step p { font-size: 0.87rem; margin: 0; }
  .step .state { font-size: 0.82rem; font-weight: 600; white-space: nowrap; padding-top: 6px; }
  .events li { margin-bottom: var(--space-2); font-size: 0.86rem; color: var(--color-ink-700); }
  .stay-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: var(--space-5); align-items: start; }
  @media (max-width: 900px) { .stay-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/guard.js" data-role="patient"></script>

<div id="dash-topbar"></div>
<div class="dash-shell">
  <div id="dash-sidebar"></div>
  <main class="dash-main" id="stay-root">
    <div class="skeleton" style="height:36px; width:60%; margin-bottom:var(--space-4);"></div>
    <div class="card skeleton" style="height:120px; margin-bottom:var(--space-4);"></div>
    <div class="card skeleton" style="height:260px;"></div>
  </main>
</div>

<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtMins = (m) => (m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m` : `${m}m`);
  const fmtClock = (s) => s ? new Date(s.replace(' ', 'T')).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  const fmtWhen = (s) => s ? new Date(s.replace(' ', 'T')).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
  // What each step means, in words a patient's family understands.
  const EXPLAIN = {
    documentation: 'Your doctor\'s discharge summary and any certificates are being prepared.',
    billing: 'The billing team finalises your hospital bill.',
    insurance: 'Your insurer approves the claim so you are not asked to pay out of pocket.',
    pharmacy: 'The pharmacy packs the medicines you will take home.',
    nursing: 'A nurse explains your medicines, wound care and warning signs to watch for.',
  };

  let data = null;
  let fetchedAt = Date.now();
  const live = (m) => m + Math.floor((Date.now() - fetchedAt) / 60000);

  document.addEventListener('mb:auth-ready', (e) => {
    MB_LAYOUT.renderDashboardShell('patient', 'Hospital Stay');
    MB_LAYOUT.renderUserMenu(e.detail, { showDashboardLink: false });
    load();
    setInterval(load, 30000);
    setInterval(() => { if (data && data.admission && data.admission.status === 'cleared') render(); }, 15000);
  });

  async function load() {
    try {
      data = await api.get('/discharge/my-stay');
      fetchedAt = Date.now();
      render();
    } catch (err) {
      document.getElementById('stay-root').innerHTML = `<div class="alert alert-danger">${esc(err.message)}</div>`;
    }
  }

  function render() {
    const root = document.getElementById('stay-root');
    const a = data.admission;
    if (!a) {
      root.innerHTML = `
        <h2>Hospital Stay</h2>
        <div class="card empty-state">
          <h3>You're not currently admitted</h3>
          <p class="mb-0">If you're ever admitted to a MediBridge partner hospital, this page shows, live, every step between
          "the doctor says you can go" and actually going home: billing, insurance, medicines and paperwork. No more guessing why you're still waiting.</p>
        </div>`;
      return;
    }
    if (a.status === 'admitted') {
      root.innerHTML = `
        <div class="stay-hero"><div class="eyebrow">${esc(a.hospital_name)}</div>
          <h2 class="mb-0">You're being cared for in ${esc(a.ward || 'the ward')}${a.bed ? `, bed ${esc(a.bed)}` : ''}</h2>
          <p class="text-muted">Attending doctor: ${esc(a.doctor_name)} &middot; admitted ${fmtWhen(a.admitted_at)}</p></div>
        <div class="card"><h3>What happens next</h3>
          <p class="mb-0">When ${esc(a.doctor_name)} confirms you're medically fit to leave, this page will show every remaining step
          (bill, insurance, medicines, papers) and exactly what you're waiting on, updated live.</p></div>
        ${renderPlan()}`;
      return;
    }

    const done = data.tasks.filter((t) => t.status === 'done').length;
    const total = data.tasks.length;
    const discharged = a.status === 'discharged';
    const b = data.bottleneck;
    const waitNow = discharged ? a.waiting_minutes : live(a.waiting_minutes || 0);

    let callout;
    if (discharged) {
      callout = `<div class="waiting-callout ready"><div><div class="label">Discharged</div>
        <div class="what">You left at ${fmtClock(a.discharged_at)}. Wishing you a smooth recovery.</div>
        <div class="text-sm">Your follow-ups are on <a href="/patient/care-plan.html">My Care Plan</a>.</div></div>
        <div><div class="clock">${fmtMins(waitNow)}</div><div class="text-sm text-muted" style="text-align:right;">from clearance to going home</div></div></div>`;
    } else if (done === total) {
      callout = `<div class="waiting-callout ready"><div><div class="label">All steps complete</div>
        <div class="what">You're ready to go home.</div>
        <div class="text-sm">${esc(a.doctor_name)} has been told and will complete your discharge shortly.</div></div>
        <div><div class="clock">${fmtMins(waitNow)}</div><div class="text-sm text-muted" style="text-align:right;">since you were cleared</div></div></div>`;
    } else if (b) {
      callout = `<div class="waiting-callout"><div><div class="label">Currently waiting on</div>
        <div class="what">${esc(b.patient_label)} (${fmtMins(live(b.minutes))})</div>
        <div class="text-sm">${b.reason ? `Reason: ${esc(b.reason)}. ` : ''}The ${esc(b.department_label.toLowerCase())} team and your doctor can see this delay on their screens right now.</div></div>
        <div><div class="clock">${fmtMins(waitNow)}</div><div class="text-sm text-muted" style="text-align:right;">since you were cleared</div></div></div>`;
    }

    const steps = data.tasks.map((t) => {
      let state;
      if (t.status === 'done') state = `<span style="color:var(--color-success-500);">Done${t.completed_at ? ` at ${fmtClock(t.completed_at)}` : ''}</span>`;
      else if (t.status === 'blocked') state = `<span style="color:var(--color-warning-500);">Delayed</span>`;
      else if (t.status === 'in_progress') state = `<span style="color:var(--color-info-500);">In progress</span>`;
      else state = '<span class="text-muted">Not started yet</span>';
      return `
        <li class="step ${t.status}">
          <div class="node">${t.status === 'done' ? CHECK : ''}</div>
          <div><h4>${esc(t.patient_label)}</h4><p class="text-muted">${EXPLAIN[t.department] || ''}</p>
            ${t.status === 'blocked' ? `<p style="margin-top:var(--space-1);"><strong>Why the delay:</strong> ${esc(t.blocked_reason)}</p>` : ''}</div>
          <div class="state">${state}</div>
        </li>`;
    }).join('');

    root.innerHTML = `
      <div class="stay-hero"><div class="eyebrow">${esc(a.hospital_name)} &middot; ${esc(a.ward || '')}${a.bed ? `, bed ${esc(a.bed)}` : ''}</div>
        <h2 class="mb-0">${discharged ? 'Your hospital stay is complete' : 'You\'re medically cleared. Here\'s what\'s left before you can go home.'}</h2>
        <p class="text-muted">Cleared by ${esc(a.doctor_name)} at ${fmtClock(a.cleared_at)} &middot; this page updates automatically.</p></div>
      ${callout || ''}
      <div class="stay-grid">
        <div class="card">
          <div class="card-header"><h3 class="mb-0">Steps to going home</h3><span class="text-sm text-muted">${done} of ${total} done</span></div>
          <div class="progress-line"><span style="width:${total ? Math.round(done / total * 100) : 0}%"></span></div>
          <ol class="stepper">${steps}</ol>
        </div>
        <div>
          ${renderPlan()}
          <div class="card" style="margin-top:var(--space-5);">
            <h3>Activity</h3>
            <ul class="events" style="padding-left:1rem;">${data.events.slice(0, 12).map((ev) => `<li><span class="text-muted">${fmtClock(ev.created_at)}</span> &middot; ${esc(ev.message)}</li>`).join('')}</ul>
          </div>
        </div>
      </div>`;
  }

  function renderPlan() {
    const p = data.carePlan;
    if (!p) return `<div class="card"><h3>Your going-home plan</h3><p class="text-sm text-muted mb-0">Your doctor will add a plain-language plan for after you leave.</p></div>`;
    return `
      <div class="card">
        <h3>Your going-home plan</h3>
        <p>${esc(p.plain_summary)}</p>
        ${(p.commitments || []).length ? `<ul class="text-sm">${p.commitments.map((c) => `<li>${esc(c.title)}${c.due_date ? ` &middot; by ${esc(c.due_date)}` : ''}</li>`).join('')}</ul>` : ''}
        <p class="text-sm text-muted mb-0" style="margin-top:var(--space-2);">From ${esc(p.doctor_name)}</p>
      </div>`;
  }
</script>
</body>
</html>
