<!DOCTYPE html>
<html lang="en" class="mb-auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Brief — MediBridge</title>
<link rel="stylesheet" href="/css/main.css">
<style>
  .bf-brief-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-5); }
  .bf-brief-head .bf-eyebrow { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-primary-700); margin-bottom: var(--space-1); }
  .bf-brief-head h2 { margin-bottom: var(--space-1); }
  .bf-patient-card { display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-5); align-items: center; }
  .bf-patient-card .avatar { width: 64px; height: 64px; font-size: 1.3rem; }
  .bf-vitals-line { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); color: var(--color-ink-700); font-size: 0.9rem; margin-top: var(--space-1); }
  .bf-vitals-line strong { color: var(--color-ink-900); }
  .bf-chip-row { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
  .bf-contact-box { text-align: right; font-size: 0.85rem; color: var(--color-ink-500); }
  .bf-contact-box strong { display: block; color: var(--color-ink-900); font-size: 0.9rem; }
  .bf-flag-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .bf-flag { display: flex; align-items: center; gap: var(--space-3); padding: 0.6rem 0.85rem; border-radius: var(--radius-sm); border-left: 4px solid var(--color-ink-300); background: var(--color-ink-100); font-size: 0.9rem; font-weight: 500; }
  .bf-flag.danger { border-left-color: var(--color-danger-500); background: var(--color-danger-100); }
  .bf-flag.warning { border-left-color: var(--color-warning-500); background: var(--color-warning-100); }
  .bf-flag.info { border-left-color: var(--color-info-500); background: var(--color-info-100); }
  .bf-flag .bf-lvl { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; min-width: 62px; }
  .bf-brief-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: var(--space-5); align-items: start; margin-top: var(--space-5); }
  .bf-brief-grid > .bf-stack { display: flex; flex-direction: column; gap: var(--space-5); }
  .bf-complaint { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; line-height: 1.35; color: var(--color-ink-900); margin: 0 0 var(--space-3); }
  .bf-kv { display: grid; grid-template-columns: 150px 1fr; gap: var(--space-2) var(--space-4); font-size: 0.9rem; margin-top: var(--space-4); }
  .bf-kv dt { color: var(--color-ink-500); font-weight: 600; }
  .bf-kv dd { margin: 0; color: var(--color-ink-900); }
  .bf-severity { display: inline-flex; gap: 4px; vertical-align: middle; margin-right: var(--space-2); }
  .bf-severity span { width: 22px; height: 8px; border-radius: var(--radius-full); background: var(--color-ink-200); }
  .bf-severity.s-low span.on { background: var(--color-success-500); }
  .bf-severity.s-mid span.on { background: var(--color-warning-500); }
  .bf-severity.s-high span.on { background: var(--color-danger-500); }
  .bf-question { margin-top: var(--space-4); padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm); background: var(--color-primary-50); border: 1px solid var(--color-primary-100); font-size: 0.92rem; }
  .bf-question .bf-q-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-primary-700); display: block; margin-bottom: 2px; }
  .bf-meter { height: 6px; border-radius: var(--radius-full); background: var(--color-ink-100); overflow: hidden; width: 90px; display: inline-block; vertical-align: middle; margin-right: var(--space-2); }
  .bf-meter > i { display: block; height: 100%; background: var(--color-success-500); }
  .bf-meter.mid > i { background: var(--color-warning-500); }
  .bf-meter.low > i { background: var(--color-danger-500); }
  .bf-row-list { list-style: none; padding: 0; margin: 0; }
  .bf-row-list li { display: flex; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) 0; border-top: 1px solid var(--color-ink-100); font-size: 0.9rem; }
  .bf-row-list li:first-child { border-top: none; padding-top: 0; }
  .bf-row-list .bf-sub { color: var(--color-ink-500); font-size: 0.8rem; }
  .bf-mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); text-align: center; }
  .bf-mini-stats .bf-n { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; color: var(--color-ink-900); }
  .bf-mini-stats .bf-l { font-size: 0.75rem; color: var(--color-ink-500); font-weight: 600; }
  .bf-score-line { display: flex; align-items: baseline; gap: var(--space-2); }
  .bf-score-line .bf-n { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; color: var(--color-primary-700); }
  .bf-breakdown { list-style: none; padding: 0; margin: var(--space-3) 0 0; font-size: 0.85rem; color: var(--color-ink-700); display: flex; flex-direction: column; gap: 4px; }
  .bf-empty-inline { color: var(--color-ink-500); font-size: 0.9rem; margin: 0; }
  @media (max-width: 900px) {
    .bf-brief-grid { grid-template-columns: 1fr; }
    .bf-patient-card { grid-template-columns: auto 1fr; }
    .bf-contact-box { grid-column: 1 / -1; text-align: left; }
  }
  @media print {
    #dash-topbar, #dash-sidebar, .no-print { display: none !important; }
    .dash-shell { display: block; }
  }
</style>
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/guard.js" data-role="doctor"></script>

<div id="dash-topbar"></div>
<div class="dash-shell">
  <div id="dash-sidebar"></div>
  <main class="dash-main" id="brief-root">
    <div class="skeleton" style="height:40px; width:320px; margin-bottom: var(--space-5);"></div>
    <div class="card skeleton" style="height:120px;"></div>
    <div class="card skeleton" style="height:180px; margin-top: var(--space-5);"></div>
  </main>
</div>

<script>
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const appointmentId = new URLSearchParams(window.location.search).get('appointment');

  document.addEventListener('mb:auth-ready', async (e) => {
    MB_LAYOUT.renderDashboardShell('doctor', 'Smart Brief');
    MB_LAYOUT.renderUserMenu(e.detail, { showDashboardLink: false });
    const root = document.getElementById('brief-root');
    if (!appointmentId) {
      root.innerHTML = `<div class="empty-state"><h4>No appointment selected</h4><p>Open a Smart Brief from your <a href="/doctor/appointments.html">appointments</a>.</p></div>`;
      return;
    }
    try {
      const data = await api.get(`/visit-loop/brief/${encodeURIComponent(appointmentId)}`);
      render(data);
    } catch (err) {
      root.innerHTML = `<div class="alert alert-danger">${esc(err.message || 'Could not load the brief.')}</div>`;
    }
  });

  function fmtDate(d) {
    if (!d) return '';
    return new Date(`${d.slice(0, 10)}T00:00:00`).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }
  function initials(name) { return String(name || '?').split(' ').map((p) => p[0]).slice(0, 2).join('').toUpperCase(); }
  function relDays(d) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((new Date(`${d.slice(0, 10)}T00:00:00`) - today) / 86400000);
    if (diff === 0) return 'due today';
    return diff > 0 ? `due in ${diff} day${diff > 1 ? 's' : ''}` : `${-diff} day${diff < -1 ? 's' : ''} overdue`;
  }

  function render(d) {
    const { appointment: a, patient: p, intake, medications, adherence, recentRecords, openCommitments, visitHistory, flags, careScore } = d;
    const root = document.getElementById('brief-root');
    const allergyChips = p.allergies ? p.allergies.split(',').map((x) => `<span class="badge badge-danger">Allergy: ${esc(x.trim())}</span>`).join('') : '<span class="badge badge-neutral">No known allergies</span>';
    const chronicChips = p.chronic_conditions ? p.chronic_conditions.split(',').map((x) => `<span class="badge badge-warning">${esc(x.trim())}</span>`).join('') : '';
    const newAllergy = intake && intake.new_allergies ? `<span class="badge badge-danger">New: ${esc(intake.new_allergies)}</span>` : '';

    root.innerHTML = `
      <div class="bf-brief-head">
        <div>
          <div class="bf-eyebrow">Smart Brief · compiled automatically</div>
          <h2>Before you see ${esc(p.full_name.split(' ')[0])}</h2>
          <p class="text-muted mb-0">${esc(fmtDate(a.appointment_date))} at ${esc(a.start_time.slice(0, 5))} · ${esc(a.consultation_mode.replace('_', ' '))} · <span class="badge status-${esc(a.status)}">${esc(a.status)}</span></p>
        </div>
        <div class="flex gap-2 no-print">
          <button class="btn btn-outline btn-sm" onclick="window.print()">Print</button>
          <a class="btn btn-primary btn-sm" href="/doctor/appointments.html">Start consultation</a>
        </div>
      </div>

      <div class="card bf-patient-card">
        <div class="avatar">${esc(initials(p.full_name))}</div>
        <div>
          <h3 class="mb-0">${esc(p.full_name)}</h3>
          <div class="bf-vitals-line">
            <span><strong>${p.age != null ? esc(p.age) + ' y' : 'Age —'}</strong> · ${esc((p.gender || '').replace(/_/g, ' ') || 'gender —')}</span>
            <span>Blood group <strong>${esc(p.blood_group || '—')}</strong></span>
            <span>BMI <strong>${p.bmi != null ? esc(p.bmi) : '—'}</strong>${p.height_cm ? ` <span class="text-muted">(${esc(Number(p.height_cm))} cm, ${esc(Number(p.weight_kg))} kg)</span>` : ''}</span>
            ${p.city ? `<span>${esc(p.city)}</span>` : ''}
          </div>
          <div class="bf-chip-row">${allergyChips}${newAllergy}${chronicChips}</div>
        </div>
        <div class="bf-contact-box">
          ${p.phone ? `<strong>${esc(p.phone)}</strong>` : ''}
          ${p.emergency_contact_name ? `Emergency: ${esc(p.emergency_contact_name)}${p.emergency_contact_phone ? ' · ' + esc(p.emergency_contact_phone) : ''}` : ''}
        </div>
      </div>

      <div class="card" style="margin-top: var(--space-5);">
        <div class="card-header"><h3>Things to know first</h3><span class="text-sm text-muted">${flags.length} item${flags.length === 1 ? '' : 's'}</span></div>
        ${flags.length ? `<ul class="bf-flag-list">${flags.map((f) => `<li class="bf-flag ${esc(f.level)}"><span class="bf-lvl">${f.level === 'danger' ? 'Alert' : f.level === 'warning' ? 'Watch' : 'Note'}</span>${esc(f.text)}</li>`).join('')}</ul>` : '<p class="bf-empty-inline">Nothing unusual flagged for this visit.</p>'}
      </div>

      <div class="bf-brief-grid">
        <div class="bf-stack">
          ${renderIntake(intake, a)}
          ${renderMeds(medications, adherence)}
          ${renderRecords(recentRecords)}
        </div>
        <div class="bf-stack">
          ${renderScore(careScore)}
          ${renderCommitments(openCommitments)}
          <div class="card">
            <div class="card-header"><h3>Visit history</h3></div>
            <div class="bf-mini-stats">
              <div><div class="bf-n">${esc(visitHistory.total)}</div><div class="bf-l">Completed visits</div></div>
              <div><div class="bf-n">${esc(visitHistory.withThisDoctor)}</div><div class="bf-l">With you</div></div>
              <div><div class="bf-n" style="font-size:1rem; padding-top:0.45rem;">${visitHistory.lastVisit ? esc(fmtDate(visitHistory.lastVisit)) : '—'}</div><div class="bf-l">Last visit</div></div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function renderIntake(i, a) {
    if (!i) {
      return `<div class="card">
        <div class="card-header"><h3>Why they're coming</h3><span class="badge badge-neutral">No intake</span></div>
        ${a.reason ? `<p class="bf-complaint">${esc(a.reason)}</p><p class="text-sm text-muted mb-0">Reason given at booking. The patient has not filled the pre-visit form yet.</p>` : '<p class="bf-empty-inline">The patient has not shared pre-visit information yet.</p>'}
      </div>`;
    }
    const sev = Number(i.severity) || 0;
    const sevClass = sev >= 4 ? 's-high' : sev === 3 ? 's-mid' : 's-low';
    const tags = (i.symptoms || '').split(',').map((s) => s.trim()).filter(Boolean);
    return `<div class="card">
      <div class="card-header"><h3>Why they're coming</h3><span class="badge badge-success">From patient's intake</span></div>
      <p class="bf-complaint">“${esc(i.chief_complaint)}”</p>
      ${tags.length ? `<div class="bf-chip-row" style="margin-top:0;">${tags.map((t) => `<span class="badge badge-info">${esc(t)}</span>`).join('')}</div>` : ''}
      <dl class="bf-kv">
        <dt>Duration</dt><dd>${esc(i.symptom_duration || '—')}</dd>
        <dt>Severity</dt><dd>${sev ? `<span class="bf-severity ${sevClass}">${[1, 2, 3, 4, 5].map((n) => `<span class="${n <= sev ? 'on' : ''}"></span>`).join('')}</span>${sev}/5` : '—'}</dd>
        <dt>Medication changes</dt><dd>${esc(i.medication_changes || 'None reported')}</dd>
        <dt>New allergies</dt><dd>${i.new_allergies ? `<span class="badge badge-danger">${esc(i.new_allergies)}</span>` : 'None reported'}</dd>
      </dl>
      ${i.questions_for_doctor ? `<div class="bf-question"><span class="bf-q-label">Their question for you</span>${esc(i.questions_for_doctor)}</div>` : ''}
    </div>`;
  }

  function renderMeds(meds, adherence) {
    const meter = (pct) => {
      if (pct == null) return '<span class="text-sm text-muted">no logs this week</span>';
      const cls = pct >= 80 ? '' : pct >= 50 ? 'mid' : 'low';
      return `<span class="bf-meter ${cls}"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></span><span class="text-sm">${pct}%</span>`;
    };
    return `<div class="card">
      <div class="card-header"><h3>Current medications</h3>
        <span class="text-sm text-muted">30-day adherence: <strong>${adherence.pct30 != null ? adherence.pct30 + '%' : '—'}</strong>${adherence.missedLast7 ? ` · ${adherence.missedLast7} missed this week` : ''}</span></div>
      ${meds.length ? `<ul class="bf-row-list">${meds.map((m) => `<li><div><strong>${esc(m.name)}</strong><div class="bf-sub">${esc(m.dosage)} · ${esc(m.frequency)}</div></div><div style="white-space:nowrap;">${meter(m.adherence_pct_7d)}</div></li>`).join('')}</ul>` : '<p class="bf-empty-inline">No active medications on record.</p>'}
    </div>`;
  }

  function renderRecords(records) {
    return `<div class="card">
      <div class="card-header"><h3>Recent records</h3><a class="text-sm" href="/doctor/patients.html">Full history</a></div>
      ${records.length ? `<ul class="bf-row-list">${records.map((r) => `<li><div><strong>${esc(r.diagnosis || 'Consultation')}</strong><div class="bf-sub">${esc(r.doctor_name)}${r.vitals_bp ? ` · BP ${esc(r.vitals_bp)}` : ''}${r.vitals_pulse ? ` · ${esc(r.vitals_pulse)}` : ''}</div></div><div class="bf-sub" style="white-space:nowrap;">${esc(fmtDate(r.record_date))}</div></li>`).join('')}</ul>` : '<p class="bf-empty-inline">No previous records.</p>'}
    </div>`;
  }

  function renderScore(cs) {
    if (!cs) return '';
    const b = cs.breakdown || {};
    return `<div class="card">
      <div class="card-header"><h3>Care Score</h3><span class="text-sm text-muted">engagement, not diagnosis</span></div>
      <div class="bf-score-line"><span class="bf-n">${esc(cs.score)}</span><span class="text-muted">/ 100</span></div>
      <ul class="bf-breakdown">
        ${b.adherence ? `<li>Medicines: ${esc(b.adherence.label)}</li>` : ''}
        ${b.recency ? `<li>Check-ups: ${esc(b.recency.label)}</li>` : ''}
        ${b.followUp ? `<li>Follow-ups: ${esc(b.followUp.label)}</li>` : ''}
      </ul>
    </div>`;
  }

  function renderCommitments(list) {
    return `<div class="card">
      <div class="card-header"><h3>Open care-plan items</h3><span class="text-sm text-muted">${list.length} open</span></div>
      ${list.length ? `<ul class="bf-row-list">${list.map((c) => `<li><div>${esc(c.title)}<div class="bf-sub">${esc(String(c.kind || '').replace('_', ' '))}</div></div><div style="white-space:nowrap;">${c.due_date ? `<span class="badge ${c.overdue ? 'badge-danger' : 'badge-neutral'}">${esc(relDays(c.due_date))}</span>` : ''}</div></li>`).join('')}</ul>` : '<p class="bf-empty-inline">Nothing outstanding from earlier visits.</p>'}
    </div>`;
  }
</script>
</body>
</html>
