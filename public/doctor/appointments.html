<!DOCTYPE html>
<html lang="en" class="mb-auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointments — MediBridge</title>
<link rel="stylesheet" href="/css/main.css">
<style>
  .rx-row { display:grid; grid-template-columns: 2fr 1fr 1fr 0.7fr auto; gap: var(--space-2); margin-bottom: var(--space-2); align-items:center; }
  .cm-row { display:grid; grid-template-columns: minmax(0,1.7fr) minmax(108px,1fr) minmax(100px,0.9fr) minmax(140px,1.1fr) auto; gap: var(--space-2); margin-bottom: var(--space-2); align-items:center; }
  .cm-row.auto input.cm-title { background: var(--color-primary-50); }
  .plan-box { margin-top: var(--space-5); padding-top: var(--space-4); border-top: 1px solid var(--color-ink-200); }
  .plan-box .hint { font-size: 0.78rem; color: var(--color-ink-500); margin: 0 0 var(--space-3); }
  @media (max-width: 700px) { .rx-row, .cm-row { grid-template-columns: 1fr 1fr; } }
  .ap-row { display: flex; align-items: center; gap: var(--space-4); padding: 0.8rem var(--space-5); background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-lg); margin-bottom: var(--space-2); flex-wrap: wrap; }
  .ap-when { width: 56px; flex-shrink: 0; }
  .ap-when .mono { font-size: 0.95rem; }
  .ap-date { font-size: 0.72rem; color: var(--color-ink-500); }
  .ap-who { flex: 1; min-width: 160px; }
  .ap-who .nm { font-weight: 600; }
  .ap-who .sub { font-size: 0.8rem; color: var(--color-ink-500); }
  .ap-act { display: flex; gap: var(--space-2); align-items: center; }
  .tick { color: var(--color-success-700); display: inline-flex; }
  .tick.miss { color: var(--color-ink-400); }
</style>
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/guard.js" data-role="doctor"></script>

<div id="dash-topbar"></div>
<div class="dash-shell">
  <div id="dash-sidebar"></div>
  <main class="dash-main">
    <div class="page-head"><div><h2>Appointments</h2></div></div>
    <div class="pill-nav" id="tabs" style="margin: 0 0 var(--space-4);">
      <button data-tab="today" class="active">Today</button>
      <button data-tab="upcoming">Upcoming</button>
      <button data-tab="pending">Requests</button>
      <button data-tab="completed">Completed</button>
      <button data-tab="all">All</button>
    </div>
    <div id="appt-list"><div class="card skeleton" style="height:100px;"></div></div>
  </main>
</div>
<div id="modal-root"></div>

<script>
  let allAppointments = [];
  let intakeIds = new Set();
  let activeTab = 'today';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  document.addEventListener('mb:auth-ready', (e) => {
    MB_LAYOUT.renderDashboardShell('doctor', 'Appointments');
    MB_LAYOUT.renderUserMenu(e.detail, { showDashboardLink: false });
    load();
  });

  document.querySelectorAll('#tabs button').forEach((btn) => btn.addEventListener('click', () => {
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    render();
  }));

  async function load() {
    try {
      const [{ appointments }, status] = await Promise.all([
        api.get('/appointments'),
        api.get('/visit-loop/intake-status').catch(() => ({ appointmentIds: [] })),
      ]);
      allAppointments = appointments;
      intakeIds = new Set(status.appointmentIds);
      render();
    }
    catch (e) { document.getElementById('appt-list').innerHTML = '<div class="alert alert-danger">Could not load appointments.</div>'; }
  }

  function filtered() {
    const today = new Date().toISOString().slice(0, 10);
    if (activeTab === 'today') return allAppointments.filter((a) => a.appointment_date === today);
    if (activeTab === 'upcoming') return allAppointments.filter((a) => a.appointment_date > today && a.status !== 'cancelled');
    if (activeTab === 'pending') return allAppointments.filter((a) => a.status === 'pending');
    if (activeTab === 'completed') return allAppointments.filter((a) => a.status === 'completed');
    return allAppointments;
  }

  function render() {
    const list = filtered();
    const el = document.getElementById('appt-list');
    if (!list.length) { el.innerHTML = '<div class="empty-state"><p>None</p></div>'; return; }
    el.innerHTML = list.map((a) => {
      const open = ['pending', 'confirmed'].includes(a.status);
      const tick = open ? (intakeIds.has(a.id)
        ? `<span class="tick" title="Intake received">${MB_LAYOUT.icon('checkCircle', 16)}</span>`
        : `<span class="tick miss" title="No intake yet">${MB_LAYOUT.icon('clock', 16)}</span>`) : '';
      return `
      <div class="ap-row">
        <div class="ap-when"><div class="mono">${a.start_time.slice(0, 5)}</div><div class="ap-date">${a.appointment_date.slice(5)}</div></div>
        <div class="ap-who">
          <div class="nm">${esc(a.patient_name)}</div>
          <div class="sub">${a.consultation_mode === 'video' ? 'Video' : 'In person'}${a.reason ? ' · ' + esc(a.reason) : ''}</div>
        </div>
        ${tick}
        <span class="badge status-${a.status}">${a.status}</span>
        <div class="ap-act">
          ${open ? `<a class="btn btn-outline btn-sm" href="/doctor/brief.html?appointment=${a.id}">Brief</a>` : ''}
          ${a.status === 'pending' ? `<button class="btn btn-primary btn-sm" onclick="setStatus(${a.id},'confirmed')">Confirm</button><button class="btn btn-ghost btn-sm" onclick="setStatus(${a.id},'cancelled')">Decline</button>` : ''}
          ${a.status === 'confirmed' ? `<button class="btn btn-primary btn-sm" onclick="openNotes(${a.id}, ${a.patient_id}, '${a.patient_name.replace(/'/g, "\\'")}')">Complete</button><button class="btn btn-ghost btn-sm" onclick="setStatus(${a.id},'cancelled')">Cancel</button>` : ''}
          ${a.status === 'completed' ? `<button class="btn btn-outline btn-sm" onclick="openNotes(${a.id}, ${a.patient_id}, '${a.patient_name.replace(/'/g, "\\'")}')">Notes</button>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  async function setStatus(id, status) {
    try { await api.patch(`/appointments/${id}/status`, { status, reason: status === 'cancelled' ? 'Cancelled by doctor' : undefined }); toast.success(`${status[0].toUpperCase()}${status.slice(1)}.`); load(); }
    catch (e) { toast.error(e.message); }
  }

  function openNotes(appointmentId, patientId, patientName) {
    document.getElementById('modal-root').innerHTML = `
      <div class="modal-backdrop" id="notes-backdrop">
        <div class="modal" style="max-width:720px;">
          <div class="modal-header"><h3 class="mb-0">${patientName}</h3><button class="modal-close" id="notes-close">&times;</button></div>
          <div class="field"><label for="dx">Diagnosis</label><input id="dx" required></div>
          <div class="field"><label for="summary">Summary</label><textarea id="summary" rows="3"></textarea></div>
          <div class="form-row">
            <div class="field"><label for="bp">Blood pressure</label><input id="bp" placeholder="120/80"></div>
            <div class="field"><label for="pulse">Pulse</label><input id="pulse" placeholder="72 bpm"></div>
          </div>
          <div class="field"><label for="fu">Follow-up date</label><input type="date" id="fu"></div>

          <h4 style="margin-top:var(--space-4);">Prescriptions</h4>
          <div id="rx-rows"></div>
          <button type="button" class="btn btn-outline btn-sm" id="add-rx-row">+ Add medicine</button>

          <div class="plan-box">
            <h4 class="mb-0">Plan for the patient <span class="text-sm text-muted" style="font-weight:500;">(plain words)</span></h4>
            <div class="field"><textarea id="plain-plan" rows="3" placeholder="e.g. Take the tablet each morning, cut salt, come back in two weeks."></textarea></div>
            <div id="cm-rows"></div>
            <button type="button" class="btn btn-outline btn-sm" id="add-cm-row">+ Add step</button>
          </div>

          <div id="notes-alert" style="margin-top:var(--space-4);"></div>
          <button class="btn btn-primary btn-block" id="notes-submit" style="margin-top:var(--space-3);">Save</button>
        </div>
      </div>`;
    document.getElementById('notes-close').addEventListener('click', () => document.getElementById('modal-root').innerHTML = '');
    document.getElementById('add-rx-row').addEventListener('click', addRxRow);
    document.getElementById('add-cm-row').addEventListener('click', () => addCmRow());
    document.getElementById('fu').addEventListener('change', syncFollowUpStep);
    addRxRow();

    document.getElementById('notes-submit').addEventListener('click', async () => {
      const rows = Array.from(document.querySelectorAll('.rx-row')).map((row) => ({
        medicineName: row.querySelector('.rx-name').value.trim(),
        dosage: row.querySelector('.rx-dosage').value.trim(),
        frequency: row.querySelector('.rx-freq').value.trim(),
        durationDays: Number(row.querySelector('.rx-days').value) || null,
      })).filter((r) => r.medicineName);

      const steps = Array.from(document.querySelectorAll('.cm-row')).map((row) => ({
        title: row.querySelector('.cm-title').value.trim(),
        kind: row.querySelector('.cm-kind').value,
        ownerRole: row.querySelector('.cm-owner').value,
        dueDate: row.querySelector('.cm-due').value || null,
      })).filter((c) => c.title);
      const plainPlan = document.getElementById('plain-plan').value.trim();
      const diagnosis = document.getElementById('dx').value.trim();

      try {
        const record = await api.post('/medical-records', {
          appointmentId, patientId, diagnosis: document.getElementById('dx').value.trim(),
          consultationSummary: document.getElementById('summary').value.trim() || undefined,
          vitalsBp: document.getElementById('bp').value.trim() || undefined,
          vitalsPulse: document.getElementById('pulse').value.trim() || undefined,
          followUpDate: document.getElementById('fu').value || undefined,
          prescriptions: rows,
        });
        if (plainPlan || steps.length) {
          try {
            await api.post('/visit-loop/care-plans', {
              patientId, medicalRecordId: record.id,
              plainSummary: plainPlan.length >= 10 ? plainPlan : `Today's visit: ${diagnosis}. Please complete the steps below.`,
              commitments: steps,
            });
          } catch (planErr) { toast.error(`Record saved, but the care plan was not: ${planErr.message}`); }
        }
        toast.success('Saved.');
        document.getElementById('modal-root').innerHTML = '';
        load();
      } catch (e) { document.getElementById('notes-alert').innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
    });
  }

  function addCmRow({ title = '', kind = 'other', ownerRole = 'patient', dueDate = '', auto = false } = {}) {
    const wrap = document.getElementById('cm-rows');
    const row = document.createElement('div');
    row.className = `cm-row${auto ? ' auto' : ''}`;
    if (auto) row.dataset.auto = 'followup';
    const opt = (pairs, v) => pairs.map(([val, label]) => `<option value="${val}"${val === v ? ' selected' : ''}>${label}</option>`).join('');
    row.innerHTML = `
      <input class="cm-title" placeholder="Step, e.g. Repeat blood test" value="${esc(title)}">
      <select class="cm-kind" aria-label="Kind">${opt([['follow_up', 'Follow-up'], ['test', 'Test'], ['medication', 'Medicine'], ['lifestyle', 'Lifestyle'], ['other', 'Other']], kind)}</select>
      <select class="cm-owner" aria-label="Responsible">${opt([['patient', 'Patient'], ['doctor', 'Doctor'], ['hospital', 'Hospital']], ownerRole)}</select>
      <input class="cm-due" type="date" aria-label="Due date" value="${esc(dueDate)}">
      <button type="button" class="btn btn-ghost btn-sm" aria-label="Remove step" onclick="this.parentElement.remove()">&times;</button>
    `;
    wrap.appendChild(row);
    return row;
  }

  // Doctor enters the follow-up date once; it becomes a care-plan step automatically.
  function syncFollowUpStep() {
    const date = document.getElementById('fu').value;
    let row = document.querySelector('.cm-row[data-auto="followup"]');
    if (!date) { if (row) row.remove(); return; }
    if (!row) row = addCmRow({ title: 'Follow-up visit', kind: 'follow_up', ownerRole: 'patient', dueDate: date, auto: true });
    else row.querySelector('.cm-due').value = date;
  }

  function addRxRow() {
    const wrap = document.getElementById('rx-rows');
    const row = document.createElement('div');
    row.className = 'rx-row';
    row.innerHTML = `
      <input class="rx-name" placeholder="Medicine name">
      <input class="rx-dosage" placeholder="Dosage">
      <input class="rx-freq" placeholder="Frequency">
      <input class="rx-days" type="number" placeholder="Days">
      <button type="button" class="btn btn-ghost btn-sm" onclick="this.parentElement.remove()">&times;</button>
    `;
    wrap.appendChild(row);
  }
</script>
</body>
</html>
