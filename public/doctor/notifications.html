<!DOCTYPE html>
<html lang="en" class="mb-auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — MediBridge</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/guard.js" data-role="doctor"></script>

<div id="dash-topbar"></div>
<div class="dash-shell">
  <div id="dash-sidebar"></div>
  <main class="dash-main">
    <div class="card-header"><h2 class="mb-0">Notifications</h2><button class="btn btn-outline btn-sm" id="mark-all">Read all</button></div>
    <div id="notif-list"><div class="card skeleton" style="height:70px;"></div></div>
  </main>
</div>

<script>
  document.addEventListener('mb:auth-ready', (e) => {
    MB_LAYOUT.renderDashboardShell('doctor', 'Notifications');
    MB_LAYOUT.renderUserMenu(e.detail, { showDashboardLink: false });
    load();
  });
  const ICONS = { appointment: 'calendar', cancellation: 'x', record: 'fileText', discharge: 'bed', transfer: 'transfer', care_plan: 'listChecks' };
  async function load() {
    const el = document.getElementById('notif-list');
    const { notifications } = await api.get('/notifications');
    if (!notifications.length) { el.innerHTML = '<div class="empty-state"><p>None</p></div>'; return; }
    el.innerHTML = notifications.map((n) => `
      <div class="card card-compact" style="margin-bottom:var(--space-2); ${n.is_read ? '' : 'border-left:3px solid var(--color-primary-600);'}">
        <div class="flex justify-between items-center gap-3">
          <div class="flex gap-3 items-center">
            <span style="color:var(--color-primary-600);display:inline-flex;">${MB_LAYOUT.icon(ICONS[n.type] || 'bell', 18)}</span>
            <div><strong class="text-sm">${n.title}</strong><div class="text-sm text-muted">${n.message}</div></div>
          </div>
          ${!n.is_read ? `<button class="btn btn-ghost btn-sm" onclick="markRead(${n.id})" aria-label="Mark read">${MB_LAYOUT.icon('check', 14)}</button>` : ''}
        </div>
      </div>
    `).join('');
  }
  async function markRead(id) { await api.patch(`/notifications/${id}/read`); load(); }
  document.getElementById('mark-all').addEventListener('click', async () => { await api.patch('/notifications/read-all'); load(); });
</script>
</body>
</html>
