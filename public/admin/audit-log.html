<!DOCTYPE html>
<html lang="en" class="mb-auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Log — MediBridge</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/guard.js" data-role="admin"></script>

<div id="dash-topbar"></div>
<div class="dash-shell">
  <div id="dash-sidebar"></div>
  <main class="dash-main">
    <h2>Audit log</h2>
    <div class="table-wrap">
      <table class="data-table" style="min-width:0;">
        <thead><tr><th>When</th><th>Who</th><th>What</th></tr></thead>
        <tbody id="log-body"><tr><td colspan="3"><div class="skeleton" style="height:40px;"></div></td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script>
  document.addEventListener('mb:auth-ready', (e) => {
    MB_LAYOUT.renderDashboardShell('admin', 'Audit Log');
    MB_LAYOUT.renderUserMenu(e.detail, { showDashboardLink: false });
    load();
  });
  async function load() {
    const { logs } = await api.get('/admin/audit-logs');
    const body = document.getElementById('log-body');
    if (!logs.length) { body.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No activity yet.</td></tr>'; return; }
    const rows = logs.map((l, i) => `
      <tr${i >= 15 ? ' data-extra hidden' : ''}><td class="text-sm" style="white-space:nowrap;">${new Date(l.created_at).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</td><td>${l.user_name || 'System'}</td><td><span class="badge badge-neutral badge-plain">${l.action}</span><div class="text-xs text-muted">${l.details || ''}</div></td></tr>
    `);
    body.innerHTML = rows.join('');
    if (logs.length > 15) {
      const more = document.createElement('div');
      more.className = 'flex';
      more.style.cssText = 'justify-content:center; margin-top:var(--space-3);';
      more.innerHTML = `<button class="btn btn-ghost btn-sm">View all ${logs.length}</button>`;
      document.querySelector('.table-wrap').after(more);
      more.firstChild.addEventListener('click', (ev) => {
        const open = ev.target.dataset.open !== '1';
        ev.target.dataset.open = open ? '1' : '0';
        body.querySelectorAll('[data-extra]').forEach((r) => { r.hidden = !open; });
        ev.target.textContent = open ? 'Show less' : `View all ${logs.length}`;
      });
    }
  }
</script>
</body>
</html>
