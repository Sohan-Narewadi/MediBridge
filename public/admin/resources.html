<!DOCTYPE html>
<html lang="en" class="mb-auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Healthcare Resources — MediBridge</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/guard.js" data-role="admin"></script>

<div id="dash-topbar"></div>
<div class="dash-shell">
  <div id="dash-sidebar"></div>
  <main class="dash-main">
    <div class="card-header"><h2 class="mb-0">Healthcare Resources</h2><button class="btn btn-primary btn-sm" id="add-btn">+ Add article</button></div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Title</th><th>Category</th><th>Read time</th><th></th></tr></thead>
        <tbody id="r-body"><tr><td colspan="4"><div class="skeleton" style="height:40px;"></div></td></tr></tbody>
      </table>
    </div>
  </main>
</div>
<div id="modal-root"></div>

<script>
  let cache = [];
  document.addEventListener('mb:auth-ready', (e) => {
    MB_LAYOUT.renderDashboardShell('admin', 'Resources');
    MB_LAYOUT.renderUserMenu(e.detail, { showDashboardLink: false });
    load();
  });

  async function load() {
    const { resources } = await api.get('/resources');
    cache = resources;
    document.getElementById('r-body').innerHTML = resources.map((r) => `
      <tr>
        <td><strong>${r.title}</strong></td><td>${r.category}</td><td>${r.read_mins} min</td>
        <td><button class="btn btn-outline btn-sm" onclick="edit(${r.id})">Edit</button> <button class="btn btn-danger btn-sm" onclick="remove(${r.id})">Delete</button></td>
      </tr>
    `).join('');
  }

  async function edit(id) {
    const { resource } = await api.get(`/resources/${id}`);
    openForm(resource);
  }

  function openForm(r) {
    const editing = !!r;
    document.getElementById('modal-root').innerHTML = `
      <div class="modal-backdrop" id="rs-backdrop">
        <div class="modal" style="max-width:600px;">
          <div class="modal-header"><h3 class="mb-0">${editing ? 'Edit' : 'Add'} article</h3><button class="modal-close" id="rs-close">&times;</button></div>
          <div class="form-row">
            <div class="field"><label for="rs-title">Title</label><input id="rs-title" value="${editing ? r.title : ''}"></div>
            <div class="field"><label for="rs-cat">Category</label><input id="rs-cat" value="${editing ? r.category : ''}"></div>
          </div>
          <div class="field"><label for="rs-summary">Summary</label><input id="rs-summary" value="${editing ? r.summary : ''}"></div>
          <div class="field"><label for="rs-content">Content</label><textarea id="rs-content" rows="4">${editing ? r.content : ''}</textarea></div>
          <div class="field"><label for="rs-mins">Read minutes</label><input type="number" id="rs-mins" value="${editing ? r.read_mins : 3}"></div>
          <div id="rs-alert"></div>
          <button class="btn btn-primary btn-block" id="rs-submit">${editing ? 'Save changes' : 'Create'}</button>
        </div>
      </div>`;
    document.getElementById('rs-close').addEventListener('click', () => document.getElementById('modal-root').innerHTML = '');
    document.getElementById('rs-submit').addEventListener('click', async () => {
      const payload = {
        title: document.getElementById('rs-title').value.trim(), category: document.getElementById('rs-cat').value.trim(),
        summary: document.getElementById('rs-summary').value.trim(), content: document.getElementById('rs-content').value.trim(),
        readMins: Number(document.getElementById('rs-mins').value) || 3,
      };
      try {
        if (editing) await api.put(`/resources/${r.id}`, payload);
        else await api.post('/resources', payload);
        toast.success('Saved.');
        document.getElementById('modal-root').innerHTML = '';
        load();
      } catch (e) { document.getElementById('rs-alert').innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
    });
  }

  async function remove(id) { if (!confirm('Delete this article?')) return; try { await api.del(`/resources/${id}`); toast.success('Deleted.'); load(); } catch (e) { toast.error(e.message); } }
  document.getElementById('add-btn').addEventListener('click', () => openForm(null));
</script>
</body>
</html>
