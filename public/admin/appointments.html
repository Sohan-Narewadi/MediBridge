<!DOCTYPE html>
<html lang="en" class="mb-auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Appointments — MediBridge</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/guard.js" data-role="admin"></script>

<div id="dash-topbar"></div>
<div class="dash-shell">
  <div id="dash-sidebar"></div>
  <main class="dash-main">
    <h2>Appointments</h2>
    <div class="flex gap-3" style="margin-bottom: var(--space-4); flex-wrap:wrap;">
      <select id="f-status">
        <option value="">All statuses</option>
        <option value="pending">Pending</option><option value="confirmed">Confirmed</option>
        <option value="completed">Completed</option><option value="cancelled">Cancelled</option>
      </select>
      <input type="date" id="f-from">
      <input type="date" id="f-to">
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Patient</th><th>Doctor</th><th>Specialization</th><th>Date</th><th>Time</th><th>Mode</th><th>Status</th></tr></thead>
        <tbody id="a-body"><tr><td colspan="7"><div class="skeleton" style="height:40px;"></div></td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script>
  document.addEventListener('mb:auth-ready', (e) => {
    MB_LAYOUT.renderDashboardShell('admin', 'Appointments');
    MB_LAYOUT.renderUserMenu(e.detail, { showDashboardLink: false });
    load();
  });
  ['f-status', 'f-from', 'f-to'].forEach((id) => document.getElementById(id).addEventListener('change', load));

  async function load() {
    const body = document.getElementById('a-body');
    const params = new URLSearchParams();
    if (document.getElementById('f-status').value) params.set('status', document.getElementById('f-status').value);
    if (document.getElementById('f-from').value) params.set('from', document.getElementById('f-from').value);
    if (document.getElementById('f-to').value) params.set('to', document.getElementById('f-to').value);
    const { appointments } = await api.get(`/appointments?${params.toString()}`);
    if (!appointments.length) { body.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No appointments found.</td></tr>'; return; }
    body.innerHTML = appointments.map((a) => `
      <tr>
        <td>${a.patient_name}</td><td>${a.doctor_name}</td><td>${a.specialization}</td>
        <td>${a.appointment_date}</td><td>${a.start_time.slice(0,5)}</td>
        <td>${a.consultation_mode.replace('_',' ')}</td>
        <td><span class="badge status-${a.status}">${a.status}</span></td>
      </tr>
    `).join('');
  }
</script>
</body>
</html>
