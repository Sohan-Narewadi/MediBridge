<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — MediBridge</title>
<link rel="stylesheet" href="/css/main.css">
<style>
  .auth-shell { min-height: calc(100vh - var(--header-height)); display:flex; align-items:center; justify-content:center; padding: var(--space-7) var(--space-4); }
  .auth-card { max-width: 440px; width: 100%; padding: var(--space-6); }
  .auth-card h2 { font-size: 1.4rem; margin-bottom: 4px; }
  .demo-box { margin-top: var(--space-5); padding-top: var(--space-4); border-top: 1px solid var(--color-line); }
  .demo-box strong { display:block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-ink-500); margin-bottom: var(--space-2); }
  .demo-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .demo-box button { background: var(--color-ink-50); border: 1px solid var(--color-line); border-radius: var(--radius-full); padding: 0.35rem 0.85rem; cursor: pointer; color: var(--color-ink-900); font-weight: 500; font-size: 0.82rem; font-family: inherit; }
  .demo-box button:hover { border-color: var(--color-primary-300); color: var(--color-primary-700); background: var(--color-primary-50); }
</style>
</head>
<body>
<div id="site-header"></div>

<div class="auth-shell">
  <div class="card auth-card">
    <h2>Welcome back</h2>

    <div id="form-alert"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Log in</button>
    </form>

    <p class="text-sm text-center" style="margin-top: var(--space-5);">
      New here? <a href="/auth/register.html">Create an account</a>
    </p>

    <div class="demo-box">
      <strong>Demo</strong>
      <div class="demo-chips">
        <button type="button" data-email="patient@medibridge.demo" data-password="Patient@123">Patient</button>
        <button type="button" data-email="doctor@medibridge.demo" data-password="Doctor@123">Doctor</button>
        <button type="button" data-email="admin@medibridge.demo" data-password="Admin@123">Admin</button>
        <button type="button" data-email="insurance@medibridge.demo" data-password="Staff@123">Staff</button>
        <button type="button" data-email="desk.agnes@medibridge.demo" data-password="Staff@123">Transfer desk</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/nav.js"></script>
<script>
  const ROLE_DASHBOARD = { patient: '/patient/dashboard.html', doctor: '/doctor/dashboard.html', admin: '/admin/dashboard.html', staff: '/staff/dashboard.html' };

  document.querySelectorAll('.demo-box button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.getElementById('email').value = btn.dataset.email;
      document.getElementById('password').value = btn.dataset.password;
    });
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('form-alert');
    alertBox.innerHTML = '';
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Logging in...';

    try {
      const { user } = await api.post('/auth/login', {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });
      const params = new URLSearchParams(window.location.search);
      window.location.href = params.get('next') || ROLE_DASHBOARD[user.role] || '/index.html';
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
