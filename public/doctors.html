<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Doctors — MediBridge</title>
<link rel="stylesheet" href="/css/main.css">
<style>
  .discover-layout { display:grid; grid-template-columns: 260px 1fr; gap: var(--space-6); align-items:start; }
  @media (max-width: 860px) { .discover-layout { grid-template-columns: 1fr; } }
  .filters-card .field { margin-bottom: var(--space-4); }
  .results-head { display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--space-4); flex-wrap:wrap; gap: var(--space-3); }
  .pagination { display:flex; justify-content:center; gap: var(--space-2); margin-top: var(--space-6); }
</style>
</head>
<body>
<div id="site-header"></div>

<div class="container section-tight">
  <h1>Find the right doctor</h1>
  <p class="text-muted">Search, filter and compare verified doctors across 15 specializations.</p>

  <div class="discover-layout">
    <aside class="card filters-card">
      <h4>Filters</h4>
      <div class="field">
        <label for="f-q">Name or specialization</label>
        <input type="text" id="f-q" placeholder="e.g. cardiology, Mehta">
      </div>
      <div class="field">
        <label for="f-spec">Specialization</label>
        <select id="f-spec"><option value="">All specializations</option></select>
      </div>
      <div class="field">
        <label for="f-city">City / area</label>
        <input type="text" id="f-city" placeholder="e.g. Indiranagar">
      </div>
      <div class="field">
        <label for="f-mode">Consultation type</label>
        <select id="f-mode">
          <option value="">Any</option>
          <option value="in_person">In-person</option>
          <option value="video">Video</option>
        </select>
      </div>
      <div class="field">
        <label for="f-exp">Minimum experience</label>
        <select id="f-exp">
          <option value="">Any</option>
          <option value="5">5+ years</option>
          <option value="10">10+ years</option>
          <option value="15">15+ years</option>
        </select>
      </div>
      <div class="field">
        <label for="f-rating">Minimum rating</label>
        <select id="f-rating">
          <option value="">Any</option>
          <option value="4">4+ stars</option>
          <option value="4.5">4.5+ stars</option>
        </select>
      </div>
      <button class="btn btn-outline btn-block" id="clear-filters">Clear filters</button>
    </aside>

    <div>
      <div class="results-head">
        <span id="result-count" class="text-muted text-sm">Loading results...</span>
        <select id="sort-select" aria-label="Sort by">
          <option value="rating">Top rated</option>
          <option value="experience">Most experienced</option>
          <option value="fee_low">Fee: low to high</option>
          <option value="fee_high">Fee: high to low</option>
          <option value="name">Name A-Z</option>
        </select>
      </div>
      <div class="doctor-grid" id="doctor-results">
        <div class="card skeleton" style="height:280px;"></div>
        <div class="card skeleton" style="height:280px;"></div>
        <div class="card skeleton" style="height:280px;"></div>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/nav.js"></script>
<script>
  let currentPage = 1;

  function initials(name) { return name.split(' ').map((p) => p[0]).slice(0, 2).join('').toUpperCase(); }

  function buildQuery() {
    const params = new URLSearchParams();
    const q = document.getElementById('f-q').value.trim();
    const spec = document.getElementById('f-spec').value;
    const city = document.getElementById('f-city').value.trim();
    const mode = document.getElementById('f-mode').value;
    const exp = document.getElementById('f-exp').value;
    const rating = document.getElementById('f-rating').value;
    const sort = document.getElementById('sort-select').value;
    if (q) params.set('q', q);
    if (spec) params.set('specialization', spec);
    if (city) params.set('city', city);
    if (mode) params.set('mode', mode);
    if (exp) params.set('minExperience', exp);
    if (rating) params.set('minRating', rating);
    if (sort) params.set('sort', sort);
    params.set('page', currentPage);
    params.set('pageSize', 9);
    return params.toString();
  }

  async function loadSpecializations() {
    const { specializations } = await api.get('/specializations');
    const select = document.getElementById('f-spec');
    specializations.forEach((s) => {
      const opt = document.createElement('option');
      opt.value = s.id; opt.textContent = s.name;
      select.appendChild(opt);
    });
    const params = new URLSearchParams(window.location.search);
    if (params.get('specialization')) select.value = params.get('specialization');
    if (params.get('q')) document.getElementById('f-q').value = params.get('q');
  }

  async function loadDoctors() {
    const grid = document.getElementById('doctor-results');
    const countLabel = document.getElementById('result-count');
    grid.innerHTML = '<div class="card skeleton" style="height:280px;"></div><div class="card skeleton" style="height:280px;"></div><div class="card skeleton" style="height:280px;"></div>';

    try {
      const { doctors, total, pageSize } = await api.get(`/doctors?${buildQuery()}`);
      countLabel.textContent = `${total} doctor${total === 1 ? '' : 's'} found`;

      if (!doctors.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">&#128269;</div><h4>No doctors match your filters</h4><p>Try widening your search.</p></div>`;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      grid.innerHTML = doctors.map((d) => `
        <a href="/doctor.html?id=${d.id}" class="card doctor-card card-interactive" style="text-decoration:none; color:inherit;">
          <div class="photo">${initials(d.full_name)}</div>
          <h4>${d.full_name}</h4>
          <div class="spec">${d.specialization}</div>
          <div class="meta-row">
            <span>&#127891; ${d.experience_years} yrs</span>
            <span>&#8377;${d.consultation_fee}</span>
            ${d.city ? `<span>&#128205; ${d.city}</span>` : ''}
          </div>
          <div class="flex justify-between items-center">
            <span class="rating">&#9733; ${Number(d.rating_avg).toFixed(1)} <span class="text-muted text-sm">(${d.rating_count})</span></span>
            <span class="badge badge-info">${d.consultation_modes.includes('video') ? 'Video available' : 'In-person'}</span>
          </div>
        </a>
      `).join('');

      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      const pag = document.getElementById('pagination');
      pag.innerHTML = '';
      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn btn-sm ' + (i === currentPage ? 'btn-primary' : 'btn-outline');
        btn.textContent = i;
        btn.addEventListener('click', () => { currentPage = i; loadDoctors(); });
        pag.appendChild(btn);
      }
    } catch (e) {
      grid.innerHTML = `<div class="alert alert-danger" style="grid-column:1/-1;">Could not load doctors. Please try again.</div>`;
    }
  }

  ['f-q', 'f-city'].forEach((id) => document.getElementById(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') { currentPage = 1; loadDoctors(); } }));
  ['f-spec', 'f-mode', 'f-exp', 'f-rating', 'sort-select'].forEach((id) => document.getElementById(id).addEventListener('change', () => { currentPage = 1; loadDoctors(); }));
  document.getElementById('clear-filters').addEventListener('click', () => {
    ['f-q', 'f-city'].forEach((id) => document.getElementById(id).value = '');
    ['f-spec', 'f-mode', 'f-exp', 'f-rating'].forEach((id) => document.getElementById(id).value = '');
    currentPage = 1; loadDoctors();
  });

  loadSpecializations().then(loadDoctors);
</script>
</body>
</html>
