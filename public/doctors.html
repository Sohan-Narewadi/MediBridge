<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Doctors — MediBridge</title>
<link rel="stylesheet" href="/css/main.css">
<style>
  .page-intro { padding: var(--space-7) 0 var(--space-5); }
  .page-intro h1 { font-size: clamp(2rem, 4vw, 2.7rem); margin-bottom: 0.4rem; }
  .page-intro p { color: var(--color-ink-500); margin: 0; max-width: 520px; }
  .filters { background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); }
  .filters-grid { display: grid; grid-template-columns: 2fr 1.4fr 1fr 1fr 1fr 1fr; gap: var(--space-3); }
  .filters .f label { display: block; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--color-ink-500); margin-bottom: 0.3rem; }
  @media (max-width: 1060px) { .filters-grid { grid-template-columns: 1fr 1fr 1fr; } .filters .f.wide { grid-column: 1 / -1; } }
  @media (max-width: 560px) { .filters-grid { grid-template-columns: 1fr 1fr; } }
  .results-head { display: flex; justify-content: space-between; align-items: center; margin: var(--space-5) 0 var(--space-4); flex-wrap: wrap; gap: var(--space-3); }
  .results-head .count { font-size: 0.92rem; color: var(--color-ink-700); }
  .results-head .count strong { font-family: var(--font-display); font-size: 1.2rem; font-weight: 500; margin-right: 0.25rem; }
  .results-head .sel { min-width: 180px; }
  .results-head .sel-panel { left: auto; right: 0; }
  .pagination { display: flex; justify-content: center; gap: var(--space-2); margin-top: var(--space-7); flex-wrap: wrap; }
  .pagination .btn { min-width: 34px; padding: 0 0.6rem; }
</style>
</head>
<body>
<div id="site-header"></div>

<div class="container">
  <div class="page-intro">
    <h1>Find a doctor</h1>
  </div>

  <div class="filters">
    <div class="filters-grid">
      <div class="f wide"><label for="f-q">Name or condition</label><input type="text" id="f-q" placeholder="e.g. Dr. Rao, migraine"></div>
      <div class="f"><label for="f-spec">Specialty</label><select id="f-spec"><option value="">All specialties</option></select></div>
      <div class="f"><label for="f-mode">Visit type</label>
        <select id="f-mode"><option value="">Any</option><option value="in_person">In-person</option><option value="video">Video</option></select></div>
      <div class="f"><label for="f-exp">Experience</label>
        <select id="f-exp"><option value="">Any</option><option value="5">5+ years</option><option value="10">10+ years</option><option value="15">15+ years</option></select></div>
      <div class="f"><label for="f-rating">Rating</label>
        <select id="f-rating"><option value="">Any</option><option value="4">4+ stars</option><option value="4.5">4.5+ stars</option></select></div>
      <div class="f"><label for="f-city">Area</label><input type="text" id="f-city" placeholder="City or area"></div>
    </div>
  </div>

  <div class="results-head">
    <span id="result-count" class="count">Loading…</span>
    <div class="flex items-center gap-2">
      <button class="btn btn-ghost btn-sm" id="clear-filters">Clear filters</button>
      <select id="sort-select" aria-label="Sort by">
        <option value="rating">Top rated</option>
        <option value="experience">Most experienced</option>
        <option value="fee_low">Fee: low to high</option>
        <option value="fee_high">Fee: high to low</option>
        <option value="name">Name A-Z</option>
      </select>
    </div>
  </div>

  <div class="doctor-grid" id="doctor-results">
    <div class="card skeleton" style="height:210px;"></div>
    <div class="card skeleton" style="height:210px;"></div>
    <div class="card skeleton" style="height:210px;"></div>
  </div>
  <div class="pagination" id="pagination"></div>
</div>
<div style="height:var(--space-10);"></div>

<div id="site-footer"></div>
<script src="/js/icons.js"></script>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/dropdown.js"></script>
<script src="/js/nav.js"></script>
<script>
  let currentPage = 1;

  function initials(name) { return name.split(' ').map((p) => p[0]).slice(0, 2).join('').toUpperCase(); }

  function buildQuery() {
    const params = new URLSearchParams();
    const q = document.getElementById('f-q').value.trim();
    const spec = document.getElementById('f-spec').value;
    const city = document.getElementById('f-city').value.trim();
    const mode = document.getElementById('f-mode').value;
    const exp = document.getElementById('f-exp').value;
    const rating = document.getElementById('f-rating').value;
    const sort = document.getElementById('sort-select').value;
    if (q) params.set('q', q);
    if (spec) params.set('specialization', spec);
    if (city) params.set('city', city);
    if (mode) params.set('mode', mode);
    if (exp) params.set('minExperience', exp);
    if (rating) params.set('minRating', rating);
    if (sort) params.set('sort', sort);
    params.set('page', currentPage);
    params.set('pageSize', 9);
    return params.toString();
  }

  async function loadSpecializations() {
    const { specializations } = await api.get('/specializations');
    const select = document.getElementById('f-spec');
    specializations.forEach((s) => {
      const opt = document.createElement('option');
      opt.value = s.id; opt.textContent = s.name;
      select.appendChild(opt);
    });
    const params = new URLSearchParams(window.location.search);
    if (params.get('specialization')) select.value = params.get('specialization');
    if (params.get('q')) document.getElementById('f-q').value = params.get('q');
  }

  async function loadDoctors() {
    const grid = document.getElementById('doctor-results');
    const countLabel = document.getElementById('result-count');
    grid.innerHTML = '<div class="card skeleton" style="height:210px;"></div><div class="card skeleton" style="height:210px;"></div><div class="card skeleton" style="height:210px;"></div>';

    try {
      const { doctors, total, pageSize } = await api.get(`/doctors?${buildQuery()}`);
      countLabel.innerHTML = `<strong>${total}</strong> doctor${total === 1 ? '' : 's'} found`;

      if (!doctors.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">${MB_ICON('search', 28)}</div><h4>No doctors found</h4></div>`;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      grid.innerHTML = doctors.map(MB_LAYOUT.doctorCard).join('');

      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      const pag = document.getElementById('pagination');
      pag.innerHTML = '';
      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn btn-sm ' + (i === currentPage ? 'btn-primary' : 'btn-outline');
        btn.textContent = i;
        btn.addEventListener('click', () => { currentPage = i; loadDoctors(); });
        pag.appendChild(btn);
      }
    } catch (e) {
      grid.innerHTML = `<div class="alert alert-danger" style="grid-column:1/-1;">Could not load doctors.</div>`;
    }
  }

  ['f-q', 'f-city'].forEach((id) => document.getElementById(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') { currentPage = 1; loadDoctors(); } }));
  ['f-spec', 'f-mode', 'f-exp', 'f-rating', 'sort-select'].forEach((id) => document.getElementById(id).addEventListener('change', () => { currentPage = 1; loadDoctors(); }));
  document.getElementById('clear-filters').addEventListener('click', () => {
    ['f-q', 'f-city'].forEach((id) => document.getElementById(id).value = '');
    ['f-spec', 'f-mode', 'f-exp', 'f-rating'].forEach((id) => document.getElementById(id).value = '');
    currentPage = 1; loadDoctors();
  });

  ['f-spec', 'f-mode', 'f-exp', 'f-rating', 'sort-select'].forEach((id) => MB_SELECT.enhance(document.getElementById(id)));
  loadSpecializations().then(loadDoctors);
</script>
</body>
</html>
